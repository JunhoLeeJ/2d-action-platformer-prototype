<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2D 액션 플랫포머 프로토타입</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14151a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Consolas, monospace;
    color: #eee;
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas {
    background: #2b2f3a;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair; /* 공격/표류 방향이 마우스 조준이므로 조준경 커서로 표시 */
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }
  #hpBarOuter {
    position: relative;
    width: 200px;
    height: 22px;
    border: 2px solid #eee;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
  }
  #hpBarInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(#ff5c5c, #c62828);
    transition: width 0.12s linear;
  }
  #hpText {
    font-size: 13px;
    margin-top: 3px;
    text-shadow: 1px 1px 2px #000;
  }
  #cooldownRow {
    margin-top: 6px;
    display: flex;
    gap: 8px;
    font-size: 11px;
  }
  .cdBox {
    width: 70px;
  }
  .cdLabel {
    text-shadow: 1px 1px 2px #000;
    margin-bottom: 2px;
  }
  .cdBarOuter {
    position: relative;
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.4);
    border: 1px solid #888;
    border-radius: 3px;
    overflow: hidden;
  }
  .cdBarInner {
    height: 100%;
    width: 0%;
    background: #4fc3f7;
  }
  #respawnMsg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: bold;
    color: #ff5c5c;
    text-shadow: 2px 2px 6px #000;
    display: none;
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }
  /* 컷신 텍스트박스 - 화면 하단, 인물 이름(있으면) + 대사. 클릭/키 입력으로 다음 줄 진행(cutscene.js). */
  #cutsceneBox {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 24px;
    background: rgba(0,0,0,0.72);
    border: 2px solid #eee;
    border-radius: 6px;
    padding: 14px 18px;
    display: none;
    pointer-events: none;
    user-select: none;
    z-index: 4;
  }
  #cutsceneSpeaker {
    font-weight: bold;
    color: #ffd54f;
    margin-bottom: 4px;
    font-size: 14px;
  }
  #cutsceneLine {
    font-size: 16px;
    line-height: 1.4;
  }
  /* 페이드 오버레이 - 그 무엇(HUD 포함)보다도 위에 있어야 "완전한 암전"이 성립한다 (cutscene.js). */
  #fadeOverlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="1440" height="810"></canvas>
  <div id="hud">
    <div id="hpBarOuter">
      <div id="hpBarInner"></div>
    </div>
    <div id="hpText">HP 5 / 5</div>
    <div id="cooldownRow">
      <div class="cdBox">
        <div class="cdLabel">ATTACK</div>
        <div class="cdBarOuter"><div id="atkCdBar" class="cdBarInner"></div></div>
      </div>
      <div class="cdBox">
        <div class="cdLabel">DRIFT</div>
        <div class="cdBarOuter"><div id="driftCdBar" class="cdBarInner"></div></div>
      </div>
    </div>
  </div>
  <div id="respawnMsg">Respawn...</div>
  <div id="cutsceneBox">
    <div id="cutsceneSpeaker"></div>
    <div id="cutsceneLine"></div>
  </div>
  <div id="fadeOverlay"></div>
</div>

<!--
  전부 번들러 없는 클래식 <script> - 전역 스코프를 공유한다. 순서 제약은 두 가지뿐:
  1) js/levels/*.js는 js/engine/zones.js(ZONES 선언) 다음이어야 함 (파싱 시점에 ZONES[...]에 등록하므로)
  2) js/main.js는 반드시 맨 마지막 (currentCheckpoint/loadZone 등 다른 모든 파일이 이미 로드되어 있어야 부트스트랩 가능)
  그 외 순서는 실행 시점(함수 호출 시점)에 해석되므로 상관없다.
-->
<script src="js/config.js"></script>
<script src="js/engine/dom.js"></script>
<script src="js/engine/input.js"></script>
<script src="js/engine/timestop.js"></script>
<script src="js/engine/camera.js"></script>
<script src="js/entities/enemies.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/engine/zones.js"></script>
<script src="js/engine/checkpoint.js"></script>
<script src="js/engine/cutscene.js"></script>
<script src="js/rendering.js"></script>
<script src="js/levels/f2z3-legacy-arena.js"></script>
<script src="js/levels/f1z1-entry.js"></script>
<script src="js/levels/f1z2-platforms.js"></script>
<script src="js/main.js"></script>
</body>
</html>
