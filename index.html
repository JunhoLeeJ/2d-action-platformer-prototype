<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2D 액션 플랫포머 프로토타입</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14151a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Consolas, monospace;
    color: #eee;
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas {
    background: #2b2f3a;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair; /* 공격/표류 방향이 마우스 조준이므로 조준경 커서로 표시 */
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    pointer-events: none;
    user-select: none;
  }
  #hpBarOuter {
    position: relative;
    width: 200px;
    height: 22px;
    border: 2px solid #eee;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
  }
  #hpBarInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(#ff5c5c, #c62828);
    transition: width 0.12s linear;
  }
  #hpText {
    font-size: 13px;
    margin-top: 3px;
    text-shadow: 1px 1px 2px #000;
  }
  #cooldownRow {
    margin-top: 6px;
    display: flex;
    gap: 8px;
    font-size: 11px;
  }
  .cdBox {
    width: 70px;
  }
  .cdLabel {
    text-shadow: 1px 1px 2px #000;
    margin-bottom: 2px;
  }
  .cdBarOuter {
    position: relative;
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.4);
    border: 1px solid #888;
    border-radius: 3px;
    overflow: hidden;
  }
  .cdBarInner {
    height: 100%;
    width: 0%;
    background: #4fc3f7;
  }
  #respawnMsg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: bold;
    color: #ff5c5c;
    text-shadow: 2px 2px 6px #000;
    display: none;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="1440" height="540"></canvas>
  <div id="hud">
    <div id="hpBarOuter">
      <div id="hpBarInner"></div>
    </div>
    <div id="hpText">HP 5 / 5</div>
    <div id="cooldownRow">
      <div class="cdBox">
        <div class="cdLabel">ATTACK</div>
        <div class="cdBarOuter"><div id="atkCdBar" class="cdBarInner"></div></div>
      </div>
      <div class="cdBox">
        <div class="cdLabel">DRIFT</div>
        <div class="cdBarOuter"><div id="driftCdBar" class="cdBarInner"></div></div>
      </div>
    </div>
  </div>
  <div id="respawnMsg">Respawn...</div>
</div>

<script>
"use strict";

/* =========================================================================
   게임 개요 - 처음 이 코드를 보는 사람을 위한 지도.
   =========================================================================

   장르: 가로 스크롤 2D 액션 플랫포머. 좌우 이동 + 이단 점프로 지형을 넘으며
   포탑/추적 몬스터를 처치하고 봉쇄 벽을 넘어 레벨 끝까지 가는 것이 목표.

   조작 (전부 CONFIG 아래 "입력 처리" 섹션의 WATCHED_KEYS / mousedown 리스너 참고):
     - A / D          : 좌우 이동
     - W 또는 Space    : 점프 (이단 점프 가능, 혼용해서 눌러도 됨)
     - 마우스 좌클릭    : 근접 공격 - 땅에 있으면 마우스 커서 방향의 좁은 사각 판정, 공중이면 방향
                         무관 원형 판정(AIR_ATTACK_RADIUS, 데미지는 지상의 절반 - startAttack 참고).
                         공중 공격은 상승 속도를 AIR_ATTACK_HOP_FORCE로 덮어써 작은 "숏홉"을 겸함 -
                         이단 점프와 이어붙이면 사실상 3단 점프. 단 착지 전까지 MAX_AIR_ATTACKS(1)번만
                         가능 - 안 그러면 공격 후딜레이가 짧아서 연타로 계속 공중에 떠있을 수 있음
     - 마우스 우클릭    : 표류(drift) 발동
     - 마우스 커서      : player.facing(근접 공격 방향)을 매 프레임 결정 - 이동 방향과 무관.
                         단, 표류 반격은 방향 무관(플레이어 중심 광역 판정)이라 이 값의 영향을 안 받음

   핵심 전투 시스템 3개가 서로 맞물려 있음:

   1) 피격 유예 (anchor 상태, DRIFT_DAMAGE_GRACE_PERIOD)
      맞아도 즉시 HP가 깎이지 않고 player.pendingDamage에 { amount, timer }로 잠깐 대기한다.
      화면이 붉게 깜빡이는 동안(유예 중) 반응해서 표류를 쓰면 그 피해가 반격으로 전환되고,
      아무것도 안 하면 유예가 끝나는 순간 HP에 확정 반영된다. (damagePlayer/applyDamageToHp 참고)

   2) 표류(drift) - "안 맞은 척 버티다가 반격하는" 상태
      우클릭 한 번으로 DRIFT_DURATION 동안 진입. 표류 중엔 무적이 아니라 계속 맞을 수 있지만,
      맞은 피해가 HP로 안 가고 전부 pendingDamage에 쌓이기만 한다. 표류가 끝나는 순간(finishDrift):
        - 쌓인 피해가 있으면 그 총합 * DRIFT_COUNTER_DAMAGE_MULTIPLIER로 넓은 범위 반격 (performDriftCounterAttack)
        - 하나도 못 쌓았으면 대신 DRIFT_EMPTY_SELF_DAMAGE만큼 자해
      반격 범위 안의 투사체는 격추되고, 격추한 투사체들의 데미지 총합만큼 "2타"가 짧은 텀을 두고
      한 번 더 들어간다 (반격 2연타 연출 - 아래 3번 타임스톱과 얽혀 있음).
      반격 성공 여부에 따라 다음 표류까지의 쿨타임이 달라진다(성공=COUNTER, 실패=WHIFF).

   3) 타임스톱(히트스톱) - 실제로 피해를 입거나 반격이 터지는 "임팩트 있는 순간" 전체를 잠깐 정지
      loop()에서 timeStopTimer > 0인 동안은 update() 자체를 통째로 건너뛴다 - 플레이어/적/투사체/
      무적시간/쿨타임 등 게임 로직 전부가 그 프레임엔 얼어붙는다 (화면은 계속 그려서 정지 프레임처럼 보임).
      이 정지 덕분에 반격 2타 연출(1타 -> 짧은 정지 -> 2타 -> 정식 길이 정지 -> 재개, triggerTimeStop의
      onComplete 체이닝)이 가능하고, 무적시간도 정지 중엔 같이 멈췄다가 풀리는 순간부터 온전히 흐른다.
      단, 반격 이펙트(driftBurst)의 페이드만큼은 정지 중에도 실시간으로 흘러야 두 번 때린 게 눈에
      보이므로 tickDriftBurst()만 따로 매 프레임 호출된다 (updateDrift가 아니라 loop()에서).

   나머지(지형/카메라/적 AI/렌더링)는 아래 각 섹션 헤더를 참고. 밸런스 수치는 전부 CONFIG 하나에
   모여 있으므로, 로직을 건드리지 않고 숫자만 바꿔서 게임 느낌을 조정할 수 있다.
   ========================================================================= */

/* =========================================================================
   밸런스 / 튜닝 변수 - 여기서만 수정하면 게임 느낌을 바꿀 수 있습니다.
   ========================================================================= */
const CONFIG = {
  // --- 이동 ---
  MOVE_SPEED: 420,           // 좌우 이동 속도 (px/sec)
  GRAVITY: 2100,             // 중력 가속도 (px/sec^2)
  MAX_FALL_SPEED: 1400,      // 최대 낙하 속도 (px/sec)
  JUMP_FORCE: 760,           // 점프 초기 상승 속도 (px/sec)
  MAX_JUMPS: 2,              // 최대 점프 횟수 (2 = 이단 점프)
  // 낮은 점프("숏홉") - 공중 공격을 넣는 순간 현재 상승/낙하 속도와 무관하게 항상 AIR_ATTACK_HOP_FORCE로
  // 덮어써서 작은 점프 한 번을 더 만들어준다 (updatePlayer의 공격 입력 블록 참고). 막 뛴 직후라면 원래
  // 점프의 큰 상승 속도를 깎는 "캔슬"로 느껴지고, 이미 낙하 중이었다면 공중에서 다시 살짝 튀어오르는
  // "추가 점프"로 느껴짐 - 조건 분기 없이 같은 대입 한 줄로 두 상황 모두 자연스럽게 처리됨.
  // 이단 점프(MAX_JUMPS=2)와 조합하면 점프 → 이단 점프 → 공중 공격을 이어붙여 사실상 3단 점프도 가능.
  AIR_ATTACK_HOP_FORCE: 420, // 공중 공격 시 적용되는 상승 속도 (px/sec) - JUMP_FORCE(760)의 최고 높이(~137px) 대비 약 42px로 "낮은" 점프
  // 공중 공격은 attackRecovery(0.38s)가 점프 체공시간보다 훨씬 짧아서, 착지 없이 연타하면 매번
  // AIR_ATTACK_HOP_FORCE로 상승 속도가 갱신되어 사실상 계속 공중에 떠있을 수 있었다. 점프 횟수
  // (MAX_JUMPS)와 똑같은 방식으로 제한한다 - player.jumpsUsed/airAttacksUsed 둘 다 착지 시에만
  // 0으로 리셋되므로, "점프 → 이단 점프 → 공중 공격 1회"가 한 번 땅을 밟기 전까지 낼 수 있는 전부.
  MAX_AIR_ATTACKS: 1,        // 착지하기 전까지 공중 공격(=숏홉)을 쓸 수 있는 횟수

  // --- 근접 공격 ---
  // 땅/공중 판정은 모양(사각형 vs 원)과 데미지가 다르지만 활성/후딜레이 타이밍은 공유한다 (startAttack 참고).
  ATTACK_RANGE_W: 85,        // 지상 공격 판정 가로 크기
  ATTACK_RANGE_H: 75,        // 지상 공격 판정 세로 크기
  ATTACK_ACTIVE_DURATION: 0.08,  // 판정이 활성화되는 시간 (sec)
  ATTACK_RECOVERY_DURATION: 0.30, // 후딜레이 (sec, 이 동안 재공격 불가)
  ATTACK_DAMAGE: 1,          // 지상 공격 1회당 적에게 주는 데미지
  // 공중 공격(플레이어가 땅에 없을 때 좌클릭) 판정 반경. 플레이어 중심 기준 원형이라 방향 무관.
  // 지상 공격 판정(85x75)보다 훨씬 넓지는 않되, 방향 무관 원형이라 위/아래로는 여전히 지상 공격보다
  // 잘 닿음. 표류 반격의 최대 리치(~152px)보다는 확실히 작게 잡아 반격과 위계가 겹치지 않게 함.
  AIR_ATTACK_RADIUS: 85,
  // 데미지는 getAirAttackDamage()로 계산 - ATTACK_DAMAGE의 절반(0.5)을 상수로 다시 박지 않고 항상
  // 지상 공격의 절반으로 유지되도록 함수화 (getDriftCooldownOnCounter/Whiff와 같은 이유). 몬스터 HP를
  // 부풀리는 대신 반칸 단위 HP를 그대로 쓰고, 대신 체력 표시를 마름모(다이아) pip로 바꿔 반칸을
  // 시각적으로 표현한다 (draw()의 drawHpPip 참고) - 그래야 몬스터 HP가 낮게 유지되어 몇 대 때려야
  // 죽는지 한눈에 보이고, 표류 반격의 배율(DRIFT_COUNTER_DAMAGE_MULTIPLIER)도 원래 체감 그대로 유지됨.

  // --- 플레이어 ---
  PLAYER_MAX_HP: 5,
  HIT_INVINCIBILITY_DURATION: 0.5, // 피격 후 무적시간 (sec) - HP가 실제로 깎이는 순간(applyDamageToHp)부터 시작
  RESPAWN_DELAY: 1.2,        // 사망 후 리스폰까지 대기시간 (sec)
  PIT_FALL_BUFFER: 60,       // 낙사 판정 여유값 (px) - 화면 아래로 이 정도 더 떨어지면 사망 처리

  // --- 적 공통: 감지/어그로/공격 범위 ---
  // 모든 몬스터가 감지(detection) → 어그로(leash) → 공격(attack) 3단계 범위 개념을 공통으로 갖는다.
  // 각 몬스터 팩토리(makeTurret/makeSniper/makeChaser)가 아래 값들을 enemy.detectionRangeW/H,
  // enemy.leashRangeW/H, enemy.attackRangeW/H 인스턴스 필드로 박아 넣고, updateTurretAI/updateChaserAI는
  // CONFIG를 직접 보지 않고 그 인스턴스 필드를 읽는다 - 몬스터 종류별로 범위가 달라도 로직은
  // 똑같은 필드 이름으로 동작하게 하기 위함(체이서 전용이던 걸 전체로 일반화).
  //
  // leash/attack 범위는 숫자를 넣으면 그 거리만큼의 "유한" 범위가 되고, `Infinity`를 넣으면 그 비교
  // (`dist > range`)가 항상 false가 되어 사실상 "무제한"이 된다 - 새 상수나 특수 문자열 없이 JS의
  // Infinity 값 자체가 "이 몬스터는 한 번 어그로가 끌리면 절대 안 풀린다"는 뜻을 그대로 표현한다.
  // 체이서(유한 어그로, CHASER_LEASH_RANGE)와 포탑/저격수(무한 어그로 - makeStationaryRangeFields 참고)가
  // 서로 다른 값을 넣는 것만으로 완전히 다른 성격의 몬스터가 되는 게 이 설계의 핵심.
  ENEMY_DEFAULT_DETECTION_RANGE_W: 480, // 원래 화면(960x540) 절반 폭 - 포탑/저격수의 최초 감지 판정에 씀
  ENEMY_DEFAULT_DETECTION_RANGE_H: 270, // 원래 화면 절반 높이 - 가로/세로 둘 다 만족해야 감지됨
  // 원래 캔버스 크기에 고정해서 실제 카메라 뷰(W/H)가 넓어져도 같이 안 늘어나게 했다 - 그래야
  // 뷰포트를 넓혔을 때 "화면엔 보이지만 아직 어그로는 안 끌린" 몬스터가 생길 수 있음(나중에
  // 비-어그로 상태 전용 유휴 애니메이션을 넣을 계획이라 이 여백이 필요함 - updateTurretAI 참고).

  // --- 적 (포탑) ---
  TURRET_FIRE_INTERVAL: 2.2, // 포탑 발사 주기 (sec, 예고 시작부터 다음 예고 시작까지)
  TURRET_TELEGRAPH_DURATION: 0.5, // 발사 전 "예고" 시간 (sec) - 이 동안 포탑이 경고 표시를 보여줌
  TURRET_MAX_HP: 5,          // 포탑 체력 (지상 공격 5회 또는 공중 공격 10회에 파괴)
  PROJECTILE_SPEED: 260,     // 투사체 속도 (px/sec) - 낮을수록 피하기 쉬움
  PROJECTILE_RADIUS: 8,
  PROJECTILE_DAMAGE: 1,

  // --- 적 (저격수: 일반 포탑과 체력/발사 타이밍/투사체 속도·데미지는 전부 동일하게 공유하고
  //     projectile.unblockable만 다름 - 표류 유예/축적도 안 타고 반격으로 격추도 안 되는, 반드시
  //     직접 피해야 하는 투사체. makeSniper/updateTurretAI(sniper 분기)/updateProjectiles/
  //     performDriftCounterAttack 참고. 반경만 훨씬 크게 잡고 draw()에서 색도 다르게 그려서
  //     "이건 다른 놈이다"가 멀리서도 보이게 함.
  SNIPER_PROJECTILE_RADIUS: 15, // 일반 투사체(PROJECTILE_RADIUS=8)보다 훨씬 큼 - 눈에 확 띄어야 함

  // --- 카메라 ---
  CAMERA_SMOOTHING: 6,       // 클수록 카메라가 플레이어를 더 빨리 따라잡음 (지수 감쇠 계수, 프레임레이트 무관)
  CAMERA_DEADZONE_W: 160,    // 화면 정중앙 기준 가로 데드존 폭(px) - 이 안에서 움직이는 동안엔 카메라가 안 움직임

  // --- 적 (추적형 근접 몬스터: 체이서) ---
  CHASER_MAX_HP: 3,          // 지상 공격 3회 또는 공중 공격 6회에 처치
  CHASER_PATROL_SPEED: 90,   // 평상시 좌우 순찰 속도 (px/sec) - 아그로가 풀려 순찰 위치로 복귀할 때도 이 속도로 걸어감
  CHASER_CHASE_SPEED: 260,   // 플레이어를 인식하고 쫓아갈 때 속도 (px/sec)

  DRIFT_DURATION: 0.4,             // 표류 지속시간 (sec) - 발동 시점부터 이 시간이 지나면 자동 종료

  // 무적은 표류가 끝나는 순간(finishDrift)에만 HIT_INVINCIBILITY_DURATION만큼 부여되어, 일반 피격 후와 동일한 길이의

  // 한다 - 안 그러면 "반격 후 무적+유예가 끝나기도 전에 벌써 표류를 또 쓸 수 있는" 상황이 생겨서 쿨타임 페널티가
  // 무의미해진다. HIT_INVINCIBILITY_DURATION이나 DRIFT_DAMAGE_GRACE_PERIOD를 나중에 바꿔도 이 관계가 자동으로 유지됨.
  DRIFT_COOLDOWN_COUNTER_MARGIN: 0.4,

  // 둘 사이에 유의미한 차이를 강제하기 위해 고정값이 아니라 성공 쿨타임에 얹는 식으로 계산한다.

  DRIFT_COUNTER_DAMAGE_MULTIPLIER: 2, // 반격 1타(축적 피해)와 2타(투사체 흡수) 모두 이 배율만큼 세게 나감
  DRIFT_EMPTY_SELF_DAMAGE: 1,      // 표류 중 아무 피해도 축적하지 못한 채 종료되면 대신 플레이어가 입는 데미지
  // 반격 판정을 화면에 보여주는 시각효과 지속시간 (sec). 타임스톱과 달리 실시간으로 흐른다(loop() 참고).
  // 일부러 HITSTOP_DOUBLE_HIT_GAP보다 짧게 잡아서, 2타로 이어지는 경우 1타의 번쩍임이 완전히
  // 사라진 뒤에 2타(다른 색)가 다시 번쩍이는 "번쩍-암전-번쩍" 리듬이 나오게 한다 (showDriftBurst 참고).
  DRIFT_BURST_VISUAL_DURATION: 0.12,

  // --- 타임스톱(히트스톱) --- 이 시간 동안은 게임 전체가 완전히 멈춤(update 자체를 안 돌림).
  // player.invincibleTimer도 타임스톱 중엔 같이 멈춰있다가
  // 타임스톱이 끝나고 다시 게임이 돌아가는 시점부터 정상적으로 줄어들기 시작한다 - 즉 이미 있던 무적시간 로직은
  // 그대로 유지되고, 타임스톱이 끝난 직후부터 온전한 길이만큼 무적이 보장된다.
  // 실제로 HP가 깎이는 순간(자해 포함)과 표류 반격이 발동되는 순간(몬스터 명중 여부 무관) 둘 다
  // 같은 길이로 타임스톱이 걸린다. 화면 틴트 색만 원인(damage/counter)에 따라 다르게 표시됨.
  HITSTOP_DURATION: 0.3,
  // 반격이 투사체를 격추해 2타로 이어질 때, 1타와 2타 사이에 끼워넣는 짧은 정지 (sec).
  // DRIFT_BURST_VISUAL_DURATION보다 넉넉히 길게 잡아서, 1타 이펙트가 다 사라지고 나서도
  // 잠깐의 "정적"이 있은 뒤에 2타가 터지게 한다 - 이 정적이 있어야 두 타격이 분리되어 보인다.
  // 이 동안에도 게임은 완전히 멈춰있고, 이 시간이 끝나는 순간 2타가 발동한 뒤 HITSTOP_DURATION으로 마무리된다.
  HITSTOP_DOUBLE_HIT_GAP: 0.66,
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// --- 입력 처리 ---
// 키보드와 마우스 버튼을 같은 코드 체계로 다룬다: 마우스 좌클릭="Mouse0", 우클릭="Mouse2"를
// 가상의 키코드처럼 취급해서 heldKeys/justPressed와 동일한 파이프라인을 그대로 공유한다.
//
// - heldKeys[code]      : 지금 물리적으로 눌려있는지 (연속 입력 - 이동에 사용)
// - justPressed[code]   : "이번 프레임에 막 눌렀다"는 단발 신호 (탭 입력 - 점프/공격/표류에 사용).
//                         매 프레임 끝(update() 마지막)에 비워짐.
// - pendingKeyAfterFreeze[code] : 타임스톱(히트스톱) 도중 눌린 입력은 곧바로 justPressed가 되지 않고
//                         여기 대기한다. 타임스톱이 끝나는 순간 그 키가 "아직도" 눌려있으면 그제서야
//                         justPressed로 전환되고, 도중에 뗐으면(heldKeys가 다시 false) 그냥 버려진다
//                         (loop() 참고) - 즉 타임스톱 중의 입력은 "예약"되지 않는다.
const heldKeys = {};
const justPressed = {};
const pendingKeyAfterFreeze = {};
const WATCHED_KEYS = ["KeyA", "KeyD", "KeyW", "Space"]; // 브라우저 기본 동작(스크롤 등)을 막을 키

function handlePress(code) {
  if (!heldKeys[code]) {
    if (timeStopTimer > 0) pendingKeyAfterFreeze[code] = true;
    else justPressed[code] = true;
  }
  heldKeys[code] = true;
}
function handleRelease(code) {
  heldKeys[code] = false;
}

window.addEventListener("keydown", (e) => {
  if (WATCHED_KEYS.includes(e.code)) e.preventDefault();
  if (!e.repeat) handlePress(e.code); // heldKeys 가드가 이미 "처음 눌린 순간"만 걸러주므로 repeat 체크는 보조용
});
window.addEventListener("keyup", (e) => handleRelease(e.code));

// 마우스: 좌클릭=공격, 우클릭=표류. 우클릭 시 브라우저 컨텍스트 메뉴가 뜨지 않게 막는다.
canvas.addEventListener("mousedown", (e) => {
  e.preventDefault();
  if (e.button === 0) handlePress("Mouse0");
  else if (e.button === 2) handlePress("Mouse2");
});
window.addEventListener("mouseup", (e) => {
  if (e.button === 0) handleRelease("Mouse0");
  else if (e.button === 2) handleRelease("Mouse2");
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// 공격 방향(=player.facing)을 결정하는 조준 기준점. 이 게임은 좌우 판정만 쓰므로 x좌표만 추적한다.
// 캔버스 CSS 픽셀 좌표로 들고 있다가 updatePlayer()에서 카메라 오프셋을 더해 월드 좌표로 바꿔 쓴다
// (getMouseWorldX 참고).
let mouseScreenX = W / 2;
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  // 캔버스가 CSS로 확대/축소되어 표시되는 경우를 대비해 실제 캔버스 해상도 기준으로 환산
  mouseScreenX = (e.clientX - rect.left) * (canvas.width / rect.width);
});

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function circleRectOverlap(cx, cy, r, rect) {
  const closestX = clamp(cx, rect.x, rect.x + rect.w);
  const closestY = clamp(cy, rect.y, rect.y + rect.h);
  const dx = cx - closestX, dy = cy - closestY;
  return dx * dx + dy * dy < r * r;
}

/* --------------------------- 레벨 지형 --------------------------- */
const WORLD_WIDTH = 3840; // 캔버스 너비(960)의 4배 - 가로 스크롤 레벨

const GROUND_Y = 500, GROUND_H = 40;

// 바닥에 뚫어놓은 낙사 구간 (이 x 범위에는 바닥이 없음 - 떨어지면 사망)
const GROUND_GAPS = [
  { x: 900,  w: 100 },
  { x: 2350, w: 120 },
];

// xA와 xB 사이에 낙사 구간이 하나라도 걸쳐 있는지 - 체이서가 구멍 너머까지는 못 쫓아오게 하는 데 씀
// (체이서는 점프/낙하 판정이 없어서 구멍을 자연스럽게 못 건너기 때문에, 플레이어가 구멍을 넘으면 추적을 포기시킴)
function hasGapBetween(xA, xB) {
  const lo = Math.min(xA, xB), hi = Math.max(xA, xB);
  return GROUND_GAPS.some((gap) => gap.x < hi && gap.x + gap.w > lo);
}

// 위 GROUND_GAPS를 뺀 나머지 구간으로 바닥 조각들을 만듦
function buildGroundSegments() {
  const segments = [];
  const gaps = [...GROUND_GAPS].sort((a, b) => a.x - b.x);
  let cursor = 0;
  for (const gap of gaps) {
    if (gap.x > cursor) segments.push({ x: cursor, y: GROUND_Y, w: gap.x - cursor, h: GROUND_H });
    cursor = gap.x + gap.w;
  }
  if (cursor < WORLD_WIDTH) segments.push({ x: cursor, y: GROUND_Y, w: WORLD_WIDTH - cursor, h: GROUND_H });
  return segments;
}

// 넘을 수 없는 봉쇄 벽(게이트): x=1900 안쪽(스폰 쪽) 몬스터를 모두 처치해야 사라짐.
// 충돌 판정용 사각형은 위아래로 아주 길게 잡아서 어떤 점프로도 넘어갈 수 없게 함.
// (화면에 보이는 그림은 WALL_VISUAL로 따로 그림 - 눈에 안 보이는 위쪽까지 그릴 필요는 없어서)
const WALL = { x: 1900, y: -2000, w: 40, h: 2600 };
const WALL_VISUAL = { x: WALL.x, y: 80, w: WALL.w, h: 460 };

// 벽 안쪽(스폰 쪽, spawnX < WALL.x) 몬스터가 하나라도 살아있으면 벽은 잠긴 상태
function isWallLocked() {
  return enemies.some((e) => e.spawnX < WALL.x && e.alive);
}
function countAliveArenaEnemies() {
  return enemies.filter((e) => e.spawnX < WALL.x && e.alive).length;
}
// 벽 너머(spawnX > WALL.x) 몬스터는 벽이 잠긴 동안 "화면 밖"과 똑같이 플레이어를 인식하지 못함
function isBehindLockedWall(enemy) {
  return enemy.spawnX > WALL.x && isWallLocked();
}

  w: 34, h: 48,
  vx: 0, vy: 0,
  facing: 1,        // -1(왼쪽)|1(오른쪽) - 이동 방향이 아니라 마우스 커서 방향으로 매 프레임 갱신됨 (updatePlayer 참고). 공격/반격 판정 방향이 이 값을 그대로 씀
  onGround: false,
  jumpsUsed: 0,
  airAttacksUsed: 0, // 착지 전까지 쓴 공중 공격 횟수 - jumpsUsed와 동일하게 착지 시에만 0으로 리셋 (MAX_AIR_ATTACKS 참고)

  hp: CONFIG.PLAYER_MAX_HP,
  invincibleTimer: 0,

  attackState: "idle",     // idle | active | recovery
  attackTimer: 0,
  hitEnemiesThisSwing: new Set(),
  attackIsAirborne: false, // 이번 스윙이 공중 공격인지 (startAttack 시점의 onGround로 고정, getAttackHitbox/draw에서 참고)

  state: "anchor",         // anchor | drift - 피격 판정에는 영향 없음, "데미지를 축적할지 즉시 적용할지"만 바꾸는 레이어
  driftTimer: 0,           // drift 상태로 진입한 시점부터 DRIFT_DURATION에서 카운트다운, 0이 되면 자동 종료+반격
  driftCooldownTimer: 0,   // 0이어야 우클릭으로 표류 발동 가능 (표류 자동 종료 시점에 반격 성공 여부에 따라 getDriftCooldownOnCounter/Whiff 중 하나로 리셋됨)
  driftCooldownDuration: getDriftCooldownOnWhiff(), // 이번 쿨타임이 총 몇 초짜리였는지 (HUD 게이지가 driftCooldownTimer와 함께 비율을 계산하는 데 씀)
  pendingDamage: [],       // [{ amount, timer }, ...] - 아직 HP에 확정 반영 안 된 피해. anchor 상태에서 맞으면 timer가 DRIFT_DAMAGE_GRACE_PERIOD부터 줄어들다 0이 되면 HP 확정 적용, 그 전에 표류를 발동하면 그대로 축적되어 표류 종료 시 반격 데미지로 전환됨
  driftTrail: [],          // 잔상 표시용 최근 위치 기록 (순수 시각효과, 충돌과 무관)
  driftBurst: null,        // { x, y, w, h, timer } - 표류 종료 시 반격 판정을 잠깐 보여주기 위한 시각효과 상태
};

let gameState = "playing"; // playing | respawning
let respawnTimer = 0;

// 플레이어가 마지막으로 A/D를 눌러 실제로 이동한 방향 (제자리에 서 있어도 이전 값 유지) - 마우스 조준
// 방향인 player.facing과는 완전히 별개. 유령 NPC가 "진행 방향 반대편"에 서려고 할 때 기준으로 씀.
let playerLastMoveDir = 1;

// 유령 NPC - 순수 시각효과. 충돌/전투 등 어떤 판정에도 관여하지 않고(관여받지도 않고), 플레이어가
// 마지막으로 이동한 방향의 반대쪽에 약간 거리를 두고 자리 잡으려 한다(따라오는 동료처럼 보이게).
// 목표 위치로 순간이동하지 않고 카메라와 같은 방식(지수 감쇠)으로 매끄럽게 쫓아가므로, 방향을 자주
// 바꿔도(왔다갔다 스팸 등) 뚝뚝 끊기지 않고 자연스럽게 옆을 오간다 - 그 과정에서 잠깐 플레이어와
// 겹칠 수 있는데, 그때는 draw()에서 유령을 플레이어보다 위에 그려서 가려지지 않게 한다.
const ghostNpc = { x: player.x, y: player.y, facing: -1 };
function updateGhostNpc(dt) {
  const targetCenterX = (player.x + player.w / 2) - playerLastMoveDir * CONFIG.GHOST_NPC_FOLLOW_OFFSET;
  const targetX = targetCenterX - player.w / 2;
  const targetY = player.y;

  // 카메라 추적과 동일한 프레임레이트 무관 지수 감쇠 - 목표가 갑자기 반대편으로 튀어도
  // "즉시 순간이동"이 아니라 "빠르지만 매끄럽게 쫓아감"이 되도록.
  const smoothing = 1 - Math.exp(-CONFIG.GHOST_NPC_FOLLOW_SMOOTHING * dt);
  const prevX = ghostNpc.x;
  ghostNpc.x += (targetX - ghostNpc.x) * smoothing;
  ghostNpc.y += (targetY - ghostNpc.y) * smoothing;

  // 눈(방향 표시)은 실제로 지금 이동하고 있는 방향을 그대로 반영 - 목표점 근처에서 미세하게
  // 흔들리는 걸로 눈이 깜빡이지 않도록 아주 작은 움직임은 무시함.
  if (ghostNpc.x - prevX > 0.05) ghostNpc.facing = 1;
  else if (ghostNpc.x - prevX < -0.05) ghostNpc.facing = -1;
}

// 타임스톱(히트스톱) - 0보다 크면 메인 루프가 update()를 아예 건너뛰어 게임 전체가 얼어붙는다.
// reason은 화면 틴트 색을 고르는 용도("damage" = 피격 확정, "counter" = 반격 발동).
// duration으로 비교해서 부여하는 이유: 거의 동시에 두 트리거가 겹쳐도 더 긴/중요한 쪽 표시가 이기도록.
let timeStopTimer = 0;
let timeStopDuration = 0; // 이번 타임스톱이 총 몇 초짜리였는지 - 틴트 알파를 비율로 페이드시키는 데 씀
let timeStopReason = null; // "damage" | "counter" | null
let timeStopOnComplete = null; // 이번 프리즈 구간이 끝나는 순간 실행할 콜백 - 다음 프리즈 구간으로 이어붙이는 용도(예: 반격 2타)
function triggerTimeStop(duration, reason, onComplete = null) {
  timeStopTimer = duration;
  timeStopDuration = duration;
  timeStopReason = reason;
  timeStopOnComplete = onComplete;
}

/* --------------------------- 적 (포탑 + 체이서 공통) --------------------------- */
let enemyIdCounter = 0;

// 포탑류(제자리형) 공통 인스턴스 필드 - 감지/어그로/공격 범위가 셋 다 동일한 "화면 크기" 기본값
// (ENEMY_DEFAULT_RANGE_W/H)이라 makeTurret/makeSniper가 공유해서 쓴다.
function makeStationaryRangeFields() {
  return {
    detectionRangeW: CONFIG.ENEMY_DEFAULT_DETECTION_RANGE_W,
    detectionRangeH: CONFIG.ENEMY_DEFAULT_DETECTION_RANGE_H,
    // 포탑/저격수는 체이서와 달리 한 번 어그로가 끌리면 절대 안 풀린다 - 최초 감지만 detectionRange로
    // 판정하고, 그 이후엔 leash/attack이 Infinity라 거리 비교가 항상 통과함(위 CONFIG 주석 참고).
    leashRangeW: Infinity,
    leashRangeH: Infinity,
    attackRangeW: Infinity,
    attackRangeH: Infinity,
    aggro: false, // 감지 범위 안에 들어오기 전까진 완전 대기 상태 (예고/발사 안 함) - updateTurretAI 참고
  };
}

function makeTurret(x, y, stunnable = true) {
  return {
    id: enemyIdCounter++,
    type: "turret",
    spawnX: x, spawnY: y,
    x, y, w: 36, h: 40,
    hp: CONFIG.TURRET_MAX_HP,
    maxHp: CONFIG.TURRET_MAX_HP,
    fireTimer: CONFIG.TURRET_FIRE_INTERVAL * Math.random(), // 살짝 랜덤 오프셋
    telegraphing: false,
    alive: true,
    flashTimer: 0,
    hasBeenVisible: false, // 카메라 화면 안에 한 번이라도 들어온 적 있는지 (아직 없으면 발사 금지)
    stunnable, // false면 근접 공격을 맞아도 발사 타이머가 초기화되지 않음 (스턴 면역, 보라색으로 표시)
    ...makeStationaryRangeFields(),
  };
}

// 저격수 - 체력/발사 주기/예고 시간/범위는 포탑과 완전히 동일(CONFIG 값 공유), updateTurretAI가
// enemy.type==="sniper"만 보고 투사체를 unblockable로 바꿔서 쏨(반경도 SNIPER_PROJECTILE_RADIUS로
// 더 크게). AI 로직 자체는 포탑과 같아서 updateEnemies의 "chaser가 아니면 updateTurretAI" 분기에
// 그대로 올라탄다 - 별도 update 함수가 필요 없음.
function makeSniper(x, y, stunnable = true) {
  return {
    id: enemyIdCounter++,
    type: "sniper",
    spawnX: x, spawnY: y,
    x, y, w: 36, h: 40,
    hp: CONFIG.TURRET_MAX_HP,
    maxHp: CONFIG.TURRET_MAX_HP,
    fireTimer: CONFIG.TURRET_FIRE_INTERVAL * Math.random(),
    telegraphing: false,
    alive: true,
    flashTimer: 0,
    hasBeenVisible: false,
    stunnable,
    ...makeStationaryRangeFields(),
  };
}

// 평소엔 spawnX 기준 좌우로 patrolHalfRange만큼 왔다갔다하다가, 플레이어가 가까워지면
// (그리고 화면에 한 번은 보인 뒤라면) 쫓아와서 근접 공격하는 몬스터.
function makeChaser(x, y, patrolHalfRange, stunnable = true) {
  return {
    id: enemyIdCounter++,
    type: "chaser",
    spawnX: x, spawnY: y,
    x, y, w: 32, h: 44,
    patrolMinX: x - patrolHalfRange,
    patrolMaxX: x + patrolHalfRange,
    facing: 1,
    aiState: "patrol", // patrol | chase | windup | recovery | return(아그로 풀려서 순찰 위치로 걸어 복귀 중)
    attackTimer: 0,
    stunTimer: 0, // 0보다 크면 스턴 상태 - 사거리 안이어도 windup 진입 불가
    // "낮은 fps 인식" 연출용 - CHASER_PERCEPTION_INTERVAL마다 한 번씩만 아래 두 값을 실제 플레이어
    // 위치로 다시 채워넣고, 그 사이엔 그대로 둔다 (updateChaserAI 참고). perceptionTimer를 0으로 시작해서
    // 첫 업데이트 프레임에 바로 한 번 샘플링되게 함.
    perceptionTimer: 0,
    perceivedPlayerX: x,
    perceivedPlayerY: y,
    hp: CONFIG.CHASER_MAX_HP,
    maxHp: CONFIG.CHASER_MAX_HP,
    alive: true,
    flashTimer: 0,
    hasBeenVisible: false,
    stunnable,
    // "적 공통" 범위 필드 (CONFIG 주석 참고) - updateChaserAI/getChaserAttackHitbox가 CONFIG.CHASER_*를
    // 직접 읽지 않고 이 인스턴스 필드를 읽는다. leashRangeH는 체이서가 원래 세로 어그로 범위가 따로
    // 없었으므로(가로 거리만 봄) Infinity로 둬서 그 원래 동작을 그대로 유지.
    detectionRangeW: CONFIG.CHASER_DETECTION_RANGE,
    detectionRangeH: CONFIG.CHASER_DETECTION_VERTICAL_RANGE,
    leashRangeW: CONFIG.CHASER_LEASH_RANGE,
    leashRangeH: Infinity,
    attackRangeW: CONFIG.CHASER_ATTACK_RANGE_W,
    attackRangeH: CONFIG.CHASER_ATTACK_RANGE_H,
  };
}

const enemies = [
  makeTurret(230,  500 - 40),  // 바닥
  makeTurret(480,  300 - 40),  // 고정 플랫폼
  makeTurret(760,  390 - 40),  // 원웨이 플랫폼
  makeTurret(1090, 420 - 40),  // 원웨이 플랫폼
  makeTurret(1340, 320 - 40),  // 고정 플랫폼
  makeTurret(1600, 500 - 40, false), // 바닥 (트인 구간) - 벽 왼쪽 스턴 면역 수문장
  makeSniper(1780, 260 - 40),  // 고정 플랫폼 - 벽 안쪽 마지막 관문, 반드시 피해야 하는 투사체
  makeTurret(2040, 390 - 40, false), // 원웨이 플랫폼 - 벽 오른쪽 스턴 면역 수문장
  makeSniper(2260, 300 - 40),  // 원웨이 플랫폼 - 벽 통과 직후
  makeTurret(2560, 420 - 40), // 고정 플랫폼
  makeTurret(3190, 420 - 40), // 원웨이 플랫폼
  makeTurret(3630, 260 - 40), // 고정 플랫폼 (레벨 끝자락)
  makeChaser(2200, GROUND_Y - 44, 100),        // 바닥 순찰 - 스턴 걸림
  makeChaser(2700, GROUND_Y - 44, 80, false),  // 바닥 순찰 - 스턴 면역
];

// 플레이어 리스폰 시 적도 처음 상태(체력/생존 여부/타이머/AI 상태)로 전부 되돌림
function resetEnemies() {
  for (const enemy of enemies) {
    enemy.x = enemy.spawnX;
    enemy.y = enemy.spawnY;
    enemy.hp = enemy.maxHp;
    enemy.alive = true;
    enemy.flashTimer = 0;
    enemy.hasBeenVisible = false;
    if (enemy.type === "chaser") {
      enemy.facing = 1;
      enemy.aiState = "patrol";
      enemy.attackTimer = 0;
      enemy.stunTimer = 0;
      enemy.perceptionTimer = 0; // 리스폰 직후 바로 한 번 다시 샘플링되도록
      enemy.perceivedPlayerX = enemy.spawnX;
      enemy.perceivedPlayerY = enemy.spawnY;
    } else {
      enemy.telegraphing = false;
      enemy.fireTimer = CONFIG.TURRET_FIRE_INTERVAL * Math.random();
      enemy.aggro = false;
    }
  }
}

const projectiles = []; // {x,y,vx,vy,r}

/* --------------------------- 카메라 --------------------------- */
// camera.x/y = 캔버스 좌측 상단이 가리키는 "월드 좌표". 월드 오브젝트를 그릴 때
// 화면 좌표 = 월드 좌표 - camera 값 이 되도록 draw()에서 translate 처리한다.
const camera = { x: 0, y: 0 };

function snapCameraToPlayer() {
  camera.x = clamp(player.x + player.w / 2 - W / 2, 0, WORLD_WIDTH - W);
  camera.y = 0;
}

function updateCamera(dt) {
  const playerCenterX = player.x + player.w / 2;
  const halfDeadzone = CONFIG.CAMERA_DEADZONE_W / 2;
  const leftBound = camera.x + W / 2 - halfDeadzone;
  const rightBound = camera.x + W / 2 + halfDeadzone;

  // 데드존: 플레이어가 화면 중앙 근처 일정 범위 안에 있는 동안은 목표 위치를 그대로 유지
  let targetX = camera.x;
  if (playerCenterX < leftBound) targetX = playerCenterX - (W / 2 - halfDeadzone);
  else if (playerCenterX > rightBound) targetX = playerCenterX - (W / 2 + halfDeadzone);

  // 지수 감쇠 lerp: 프레임레이트가 들쭉날쭉해도 동일한 체감 속도로 부드럽게 따라감
  const smoothing = 1 - Math.exp(-CONFIG.CAMERA_SMOOTHING * dt);
  camera.x += (targetX - camera.x) * smoothing;

  // 레벨 경계를 벗어나지 않도록 고정
  camera.x = clamp(camera.x, 0, WORLD_WIDTH - W);
  camera.y = 0; // 세로 스크롤 없음 (레벨 높이 = 캔버스 높이)
}

// 현재 카메라 뷰포트(화면) 안에 해당 월드 오브젝트가 보이는지 여부
function isInCameraView(rect) {
  return rectsOverlap(rect, { x: camera.x, y: camera.y, w: W, h: H });
}

/* --------------------------- 업데이트 로직 --------------------------- */

function startAttack() {
  player.attackState = "active";
  player.attackTimer = CONFIG.ATTACK_ACTIVE_DURATION;
  player.hitEnemiesThisSwing.clear();
  // 스윙 시작 시점의 접지 상태로 고정 - 활성 시간이 0.08초뿐이라 도중에 이/착지해도 스윙 종류가
  // 안 바뀌게 함(모양/데미지가 프레임 중간에 바뀌면 시각효과와 판정이 어긋나 보임).
  player.attackIsAirborne = !player.onGround;
}

// 공중 공격 데미지 = 지상 공격(ATTACK_DAMAGE)의 절반. 상수로 다시 박지 않고 항상 지상 공격을 따라가도록
// 함수화 (getDriftCooldownOnCounter/Whiff와 같은 이유 - CONFIG.ATTACK_DAMAGE가 바뀌어도 관계가 자동 유지됨).
function getAirAttackDamage() {
  return CONFIG.ATTACK_DAMAGE / 2;
}

// 카메라 오프셋을 반영해 마우스 커서의 월드 x좌표를 구함 (player.facing 갱신에 씀)
function getMouseWorldX() {
  return mouseScreenX + camera.x;
}

// 지상 공격 판정 (facing 방향으로 플레이어 옆에 배치되는 사각형). 공중 공격은 방향 무관 원형이라
// 별도 판정(AIR_ATTACK_RADIUS, updatePlayer의 attackIsAirborne 분기 참고)을 쓴다.
function getAttackHitbox() {
  const w = CONFIG.ATTACK_RANGE_W, h = CONFIG.ATTACK_RANGE_H;
  const x = player.facing === 1 ? player.x + player.w : player.x - w;
  const y = player.y + player.h / 2 - h / 2;
  return { x, y, w, h };
}

function respawnPlayer() {
  player.x = SPAWN_POINT.x;
  player.y = SPAWN_POINT.y;
  player.vx = 0;
  player.vy = 0;
  player.hp = CONFIG.PLAYER_MAX_HP;
  player.jumpsUsed = 0;
  player.airAttacksUsed = 0;
  player.invincibleTimer = CONFIG.HIT_INVINCIBILITY_DURATION * 0.5;
  player.attackState = "idle";
  player.state = "anchor";
  player.driftTimer = 0;
  player.driftCooldownTimer = 0;
  player.driftCooldownDuration = getDriftCooldownOnWhiff();
  player.pendingDamage.length = 0;
  player.driftTrail.length = 0;
  player.driftBurst = null;
  projectiles.length = 0;
  // 유령 NPC는 목표 위치를 부드럽게 쫓아가는 방식이라, 리셋 안 하면 죽기 전 위치에서부터 스폰 지점까지
  // 맵을 가로질러 슬라이딩해오는 것처럼 보인다 - 플레이어처럼 즉시 스폰 위치로 순간이동시킴.
  ghostNpc.x = SPAWN_POINT.x;
  ghostNpc.y = SPAWN_POINT.y;
  resetEnemies();
  snapCameraToPlayer(); // 리스폰 지점까지 카메라가 스르륵 끌려오지 않고 즉시 이동
  gameState = "playing";
}

function updatePlayer(dt) {
  // --- 타이머 ---
  if (player.invincibleTimer > 0) player.invincibleTimer -= dt;

  // --- 조준 방향: 이동 방향과 무관하게, 매 프레임 마우스 커서가 있는 쪽을 향하도록 갱신.
  // 근접 공격 판정(getAttackHitbox)이 이 값을 그대로 쓰기 때문에 "왼쪽으로 이동 중이어도
  // 커서가 오른쪽이면 오른쪽을 공격"이 자동으로 성립한다. (표류 반격은 방향 무관 - 플레이어
  // 중심 광역 판정이라 facing을 안 쓴다. performDriftCounterAttack 참고)
  player.facing = getMouseWorldX() < player.x + player.w / 2 ? -1 : 1;

  // --- 표류 입력 (단발 - 우클릭 한 번으로 발동, 홀드/뗄 때 입력 불필요) ---
  if (justPressed["Mouse2"] && player.state === "anchor" && player.driftCooldownTimer <= 0) {
    startDrift();
  }
  updateDrift(dt);

  // --- 좌우 이동 (A/D) ---
  let move = 0;
  if (heldKeys["KeyA"]) move -= 1;
  if (heldKeys["KeyD"]) move += 1;
  player.vx = move * CONFIG.MOVE_SPEED;
  if (move !== 0) playerLastMoveDir = move; // 유령 NPC가 "진행 방향 반대편"을 계산할 때 씀 - 제자리에 서면 이전 방향 유지

  // --- 중력 ---
  player.vy += CONFIG.GRAVITY * dt;
  if (player.vy > CONFIG.MAX_FALL_SPEED) player.vy = CONFIG.MAX_FALL_SPEED;

  // --- 점프 입력 (W 또는 Space, 둘 다 동일하게 동작) ---
  if ((justPressed["KeyW"] || justPressed["Space"]) && player.jumpsUsed < CONFIG.MAX_JUMPS) {
    player.vy = -CONFIG.JUMP_FORCE;
    player.jumpsUsed += 1;
  }

  // --- 공격 입력 / 상태 (좌클릭) ---
  // 공중 공격은 점프처럼 착지 전까지 MAX_AIR_ATTACKS번으로 제한된다 - 안 그러면 공격 후딜레이(0.38s)가
  // 점프 체공시간보다 훨씬 짧아서 착지 없이 연타로 계속 공중에 떠있을 수 있었음. 지상 공격은 이 제한과
  // 무관하게 항상 가능(player.onGround 조건). 다 썼는데 공중에서 좌클릭하면 그냥 아무 일도 안 일어남
  // (jumpsUsed 다 쓰고 점프 누르는 것과 동일한 취급).
  if (justPressed["Mouse0"] && player.attackState === "idle" &&
      (player.onGround || player.airAttacksUsed < CONFIG.MAX_AIR_ATTACKS)) {
    startAttack();
    // 숏홉: 공중 공격은 매번 상승 속도를 AIR_ATTACK_HOP_FORCE로 덮어써서 작은 점프를 하나 더 만들어준다.
    // jumpsUsed를 건드리지 않으므로 이단 점프를 다 쓴 뒤에도 나갈 수 있고, 점프 -> 이단 점프 -> 공중
    // 공격 1회를 이어붙이면 사실상 3단 점프가 됨 - 그 이상은 위 조건에 막혀 착지해야만 다시 가능.
    if (player.attackIsAirborne) {
      player.vy = -CONFIG.AIR_ATTACK_HOP_FORCE;
      player.airAttacksUsed += 1;
    }
  }
  if (player.attackState === "active") {
    player.attackTimer -= dt;
    const hitbox = player.attackIsAirborne ? null : getAttackHitbox();
    const airCx = player.x + player.w / 2, airCy = player.y + player.h / 2;
    const damage = player.attackIsAirborne ? getAirAttackDamage() : CONFIG.ATTACK_DAMAGE;
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      if (player.hitEnemiesThisSwing.has(enemy.id)) continue;
      const hit = player.attackIsAirborne
        ? circleRectOverlap(airCx, airCy, CONFIG.AIR_ATTACK_RADIUS, enemy)
        : rectsOverlap(hitbox, enemy);
      if (hit) {
        enemy.hp -= damage;
        enemy.flashTimer = 0.12;
        player.hitEnemiesThisSwing.add(enemy.id);
        // 스턴: 맞으면 공격 준비 상태를 초기화 - 계속 때리면 영원히 공격을 못 하게 됨.
        // stunnable이 false인 몬스터(보라색)는 이 효과에서 제외.
        if (enemy.stunnable) {
          if (enemy.type === "chaser") {
            if (enemy.aiState === "windup") {
              enemy.aiState = "chase"; // 근접 공격 선딜레이 캔슬 - 다시 다가와서 처음부터 다시 예고해야 함
              enemy.attackTimer = 0;
            }
            enemy.stunTimer = CONFIG.CHASER_STUN_DURATION; // 이 시간 동안은 사거리 안이어도 재진입 불가
          } else {
            enemy.fireTimer = CONFIG.TURRET_FIRE_INTERVAL;
            enemy.telegraphing = false;
          }
        }
        if (enemy.hp <= 0) enemy.alive = false;
      }
    }
    if (player.attackTimer <= 0) {
      player.attackState = "recovery";
      player.attackTimer = CONFIG.ATTACK_RECOVERY_DURATION;
    }
  } else if (player.attackState === "recovery") {
    player.attackTimer -= dt;
    if (player.attackTimer <= 0) player.attackState = "idle";
  }

  // --- 이동 적용 + 충돌 처리 (X축, 고정형 플랫폼만 - 원웨이는 좌우로 막지 않음) ---
  player.x += player.vx * dt;
  player.x = clamp(player.x, 0, WORLD_WIDTH - player.w);
  for (const s of solidPlatforms) {
    if (rectsOverlap(player, s)) {
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
      player.vx = 0;
    }
  }

  // 봉쇄 벽: 안쪽 몬스터가 다 죽기 전까지는 절대 통과 불가
  if (isWallLocked() && rectsOverlap(player, WALL)) {
    if (player.vx > 0) player.x = WALL.x - player.w;
    else if (player.vx < 0) player.x = WALL.x + WALL.w;
    player.vx = 0;
  }

  // --- 이동 적용 + 충돌 처리 (Y축) ---
  const prevBottom = player.y + player.h; // 이번 프레임에 움직이기 전 발 바닥 위치
  player.y += player.vy * dt;
  player.onGround = false;

  // 고정형 플랫폼: 위에서 착지 + 아래에서 점프 시 머리가 부딪힘 (양방향 모두 막힘)
  for (const s of solidPlatforms) {
    if (rectsOverlap(player, s)) {
      if (player.vy > 0) {
        player.y = s.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpsUsed = 0;
        player.airAttacksUsed = 0;
      } else if (player.vy < 0) {
        player.y = s.y + s.h;
        player.vy = 0;
      }
    }
  }

  // 원웨이(관통형) 플랫폼: 오직 "위에서 떨어져 착지"할 때만 막힘.
  // 아래에서 위로 통과하거나(vy < 0), 이미 플랫폼 아래에 있던 경우는 그대로 통과시킴.
  for (const p of oneWayPlatforms) {
    const horizontallyOverlapping = player.x + player.w > p.x && player.x < p.x + p.w;
    if (!horizontallyOverlapping) continue;
    const newBottom = player.y + player.h;
    const wasAboveSurface = prevBottom <= p.y + 0.5;
    if (player.vy >= 0 && wasAboveSurface && newBottom >= p.y) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsUsed = 0;
      player.airAttacksUsed = 0;
    }
  }

  // 낙사 판정: 바닥 구멍으로 떨어져 화면 아래로 일정 거리 이상 벗어나면 사망
  if (player.y > H + CONFIG.PIT_FALL_BUFFER) {
    triggerDeath();
  }
}

function triggerDeath() {
  if (gameState !== "playing") return;
  gameState = "respawning";
  respawnTimer = CONFIG.RESPAWN_DELAY;
}

/* --------------------------- 표류(drift) 상태 --------------------------- */
// 핵심: 피격 판정(충돌 감지)은 항상 본체의 실제 좌표 기준으로 그대로 동작한다 (안 바뀜).
// 모든 피격은 일단 player.pendingDamage에 { amount, timer } 로 들어간다 (즉시 HP에 반영되지 않음).
// anchor 상태에서는 이 timer가 DRIFT_DAMAGE_GRACE_PERIOD부터 매 프레임 줄어들고, 0이 되면 그제서야
// HP에 확정 반영된다 - 즉 맞아도 짧은 유예시간 동안은 취소 가능한 상태로 남아있다.
// 이 유예시간 안에 표류(우클릭)를 발동하면 그 순간 timer 감소가 멈춰서 사실상 "확정 취소"되고,
// drift 상태에서 받는 피해도 동일하게 pendingDamage에 쌓이기만 한다 (timer는 anchor일 때만 줄어듦).
// DRIFT_DURATION이 다 되어 표류가 자동 종료되는 순간, 그때까지 남아있던 pendingDamage 합계만큼
// 넓은 범위 반격을 자동으로 시전한다 (축적된 피해가 없으면 대신 플레이어가 DRIFT_EMPTY_SELF_DAMAGE만큼 자해).

// 표류 재발동 쿨타임 계산 (CONFIG의 DRIFT_COOLDOWN_COUNTER_MARGIN/WHIFF_EXTRA 주석 참고).
// 상수로 안 박아두고 함수로 계산하는 이유: HIT_INVINCIBILITY_DURATION이나 DRIFT_DAMAGE_GRACE_PERIOD가
// 나중에 바뀌어도 "반격 성공 쿨타임이 항상 그 둘의 합보다 유의미하게 길다"는 관계가 자동으로 유지되도록.
function getDriftCooldownOnCounter() {
  return CONFIG.HIT_INVINCIBILITY_DURATION + CONFIG.DRIFT_DAMAGE_GRACE_PERIOD + CONFIG.DRIFT_COOLDOWN_COUNTER_MARGIN;
}
function getDriftCooldownOnWhiff() {
  return getDriftCooldownOnCounter() + CONFIG.DRIFT_COOLDOWN_WHIFF_EXTRA;
}

// HP가 실제로 깎이는 유일한 지점 - 무적시간도 여기서 부여한다 (표류 자해로 깎일 때도 동일하게 적용됨).
// damagePlayer()에서 곧바로 주지 않는 이유: 대기 중인(pending) 피해는 아직 "맞은 것으로 확정"되지 않았기 때문.
function applyDamageToHp(amount) {
  player.hp -= amount;
  player.invincibleTimer = Math.max(player.invincibleTimer, CONFIG.HIT_INVINCIBILITY_DURATION);
  triggerTimeStop(CONFIG.HITSTOP_DURATION, "damage"); // 표류 자해도 이 함수를 거치므로 동일하게 타임스톱 적용됨
  if (player.hp <= 0) {
    player.hp = 0;
    triggerDeath();
  }
}

// V 탭 한 번으로 호출됨. 쿨타임 중엔 updatePlayer에서 애초에 호출되지 않음.
// pendingDamage는 일부러 비우지 않는다 - 유예시간 안에 맞고 바로 표류를 발동한 경우,
// 그 피해가 여기서 취소되지 않고 그대로 반격 축적량으로 이어져야 하기 때문.
function startDrift() {
  player.state = "drift";
  player.driftTimer = CONFIG.DRIFT_DURATION;
  player.driftTrail.length = 0;
  // 여기서 무적을 주지 않는다 - 표류 중엔 무적이 damagePlayer()의 가드를 막아버려서
  // 표류 중 맞은 피해가 pendingDamage에 쌓이지 못하게 되기 때문 (그건 finishDrift에서 따로 처리됨).
}

// hitbox 범위 안의 살아있는 적에게 amount만큼 데미지 - 평소 근접 공격과 동일한 스턴 규칙 적용
// (stunnable이 false인 보라색 몬스터는 면역). 반격 1타/2타가 공유해서 쓰는 공통 로직.
function applyCounterDamageToEnemies(hitbox, amount) {
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    if (!rectsOverlap(hitbox, enemy)) continue;
    enemy.hp -= amount;
    enemy.flashTimer = 0.12;
    if (enemy.stunnable) {
      if (enemy.type === "chaser") {
        if (enemy.aiState === "windup") {
          enemy.aiState = "chase";
          enemy.attackTimer = 0;
        }
        enemy.stunTimer = CONFIG.CHASER_STUN_DURATION;
      } else {
        enemy.fireTimer = CONFIG.TURRET_FIRE_INTERVAL;
        enemy.telegraphing = false;
      }
    }
    if (enemy.hp <= 0) enemy.alive = false;
  }
}

// variant: "first"(1타, 하늘색) | "bonus"(투사체 흡수로 이어진 2타, 금색) - draw()에서 색 구분에 씀.
// 색이 다른 이유: 1타/2타가 짧은 시간차로 겹쳐 보일 때도 "어느 타격인지"가 명확히 구분되게 하기 위해서.
function showDriftBurst(hitbox, variant = "first") {
  player.driftBurst = { x: hitbox.x, y: hitbox.y, w: hitbox.w, h: hitbox.h, timer: CONFIG.DRIFT_BURST_VISUAL_DURATION, variant };
}

// driftBurst의 페이드는 일부러 updateDrift(dt)가 아니라 loop()에서 매 프레임 실시간으로 돌린다.
// 반격 2연타 사이의 짧은 정지(HITSTOP_DOUBLE_HIT_GAP) 동안 게임 로직은 완전히 멈추지만,
// 이 타이머만큼은 계속 흘러야 1타의 번쩍임이 눈에 보이게 옅어지다가 2타가 다시 확 밝아지는
// 대비가 생겨서 "두 번 때렸다"는 게 실제로 보인다. update() 안에 있었다면 얼어있는 동안
// 알파가 전혀 안 줄어들어서 1타/2타 이펙트가 겹쳐 하나처럼 보이는 문제가 있었다.
function tickDriftBurst(dt) {
  if (!player.driftBurst) return;
  player.driftBurst.timer -= dt;
  if (player.driftBurst.timer <= 0) player.driftBurst = null;
}

// 표류 중 쌓인 피해를 중심으로 플레이어 주변에 넓은 범위 반격을 시전.
// 평소 근접 공격(getAttackHitbox)과 달리 방향에 관계없이 플레이어를 중심으로 한 광역 판정.
//
// 반격 범위 안의 투사체를 격추했다면, 그 투사체들의 데미지 총합으로 2타가 이어지도록 연출한다:
//   1타(투사체 격추) -> 짧은 프리즈 -> 2타(격추한 만큼 데미지) -> 원래 길이의 타임스톱 -> 게임 재개.
// 두 단계 모두 같은 hitbox를 그대로 재사용(어차피 얼어있는 동안 플레이어가 움직일 수 없음).
// 2타 자체는 투사체를 다시 검사하지 않으므로 3타로 이어질 일이 없다(체인은 여기서 끝).
function performDriftCounterAttack(amount) {
  const w = CONFIG.DRIFT_ATTACK_RANGE_W, h = CONFIG.DRIFT_ATTACK_RANGE_H;
  const hitbox = {
    x: player.x + player.w / 2 - w / 2,
    y: player.y + player.h / 2 - h / 2,
    w, h,
  };

  // amount/bonusDamage는 "원래" 피해량이고, 실제로 적에게 꽂히는 데미지는 여기서 배율을 곱해서 낸다.
  applyCounterDamageToEnemies(hitbox, amount * CONFIG.DRIFT_COUNTER_DAMAGE_MULTIPLIER);

  let bonusDamage = 0;
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.unblockable) continue; // 반격으로 격추 불가 - 반드시 직접 피해야 하는 투사체 (updateProjectiles 참고)
    if (circleRectOverlap(p.x, p.y, p.r, hitbox)) {
      bonusDamage += p.damage;
      projectiles.splice(i, 1);
    }
  }

  showDriftBurst(hitbox);

  if (bonusDamage > 0) {
    // 1타 직후엔 원래보다 짧게 멈춰서 "1타가 있었다"는 걸 눈으로 보여주고,
    // 그 프리즈가 끝나는 순간(=여전히 게임은 멈춰있는 채로) 2타를 발동한다.
    triggerTimeStop(CONFIG.HITSTOP_DOUBLE_HIT_GAP, "counter", () => {
      applyCounterDamageToEnemies(hitbox, bonusDamage * CONFIG.DRIFT_COUNTER_DAMAGE_MULTIPLIER);
      showDriftBurst(hitbox, "bonus");
      triggerTimeStop(CONFIG.HITSTOP_DURATION, "counter"); // 2타 이후엔 평소와 동일한 길이로 마무리
    });
  } else {
    triggerTimeStop(CONFIG.HITSTOP_DURATION, "counter");
  }
}

// DRIFT_DURATION이 다 되는 순간 자동으로 호출됨 - "시간이 다 되면 자동 종료"가 유일한 종료 트리거.
// 이 순간부터 쿨타임(getDriftCooldownOnCounter/Whiff로 계산됨)이 시작된다.
function finishDrift() {
  const totalDamage = player.pendingDamage.reduce((sum, entry) => sum + entry.amount, 0);
  player.pendingDamage.length = 0;
  player.state = "anchor";
  player.driftTrail.length = 0;

  // 표류가 끝나는 이 시점에만 무적을 준다 - 반격이든 자해든(자해는 applyDamageToHp에서 한 번 더 걸리지만
  // Math.max라 안전함) 결과와 무관하게 "이벤트 직후" 무적시간은 항상 HIT_INVINCIBILITY_DURATION으로 동일.
  player.invincibleTimer = Math.max(player.invincibleTimer, CONFIG.HIT_INVINCIBILITY_DURATION);

  // 실제로 피해를 쌓아서 반격이 나갔으면(몬스터 명중 여부와 무관) 쿨타임을 짧게 돌려주고,
  // 아무 피해도 못 쌓아 자해로 끝났으면 페널티로 쿨타임을 길게 문다.
  if (totalDamage > 0) {
    performDriftCounterAttack(totalDamage);
    player.driftCooldownDuration = getDriftCooldownOnCounter();
  } else {
    applyDamageToHp(CONFIG.DRIFT_EMPTY_SELF_DAMAGE); // 아무 피해도 못 쌓았으면 대신 자해
    player.driftCooldownDuration = getDriftCooldownOnWhiff();
  }
  player.driftCooldownTimer = player.driftCooldownDuration;
}

function updateDrift(dt) {
  if (player.driftCooldownTimer > 0) {
    player.driftCooldownTimer = Math.max(0, player.driftCooldownTimer - dt);
  }

  // anchor 상태일 때만 유예시간이 흐른다 - drift로 전환되는 순간 이 루프를 안 타게 되어
  // 남은 pendingDamage가 사실상 "확정 취소 + 반격 축적"으로 잠기는 효과가 생긴다.
  if (player.state === "anchor") {
    for (let i = player.pendingDamage.length - 1; i >= 0; i--) {
      const entry = player.pendingDamage[i];
      entry.timer -= dt;
      if (entry.timer <= 0) {
        applyDamageToHp(entry.amount);
        player.pendingDamage.splice(i, 1);
      }
    }
    // 무적 중엔(이번 루프에서 막 걸렸든 이미 걸려있었든) 대기 중이던 유예 데미지를 전부 무효화한다.
    // 안 그러면: A에 맞고(유예 시작) 무적이 걸리기 전에 B에도 맞아서(유예 시작) 두 건이 대기하다가,
    // A의 유예가 먼저 끝나 HP 확정+무적 부여된 뒤에도 B의 유예 타이머는 계속 돌아가다 무적 중에
    // 끝나버려서 무적을 뚫고 또 HP가 깎이는 문제가 있었음. 루프 뒤에서 한 번 더 검사하므로
    // 이번 프레임에 어느 항목이 무적을 유발했든 지연 없이 같은 프레임에 나머지가 전부 정리된다.
    if (player.invincibleTimer > 0) {
      player.pendingDamage.length = 0;
    }
  }

  if (player.state === "drift") {
    player.driftTrail.push({ x: player.x, y: player.y });
    if (player.driftTrail.length > 6) player.driftTrail.shift();

    player.driftTimer -= dt;
    if (player.driftTimer <= 0) finishDrift();
  }
  // driftBurst의 페이드는 tickDriftBurst()에서 실시간으로 처리한다 (여기서 안 하는 이유는 그 함수 주석 참고).
}

function damagePlayer(amount) {
  if (player.invincibleTimer > 0 || gameState !== "playing") return;
  // 무적시간은 여기서 주지 않는다 (실제로 HP가 깎히는 applyDamageToHp에서 부여됨) - 그래야
  // 유예시간/표류 중에 또 맞은 피해도 무적에 막히지 않고 pendingDamage에 쌓여 반격에 반영된다.
  // 즉시 HP를 깎지 않고 항상 유예 상태로 들어간다. anchor 상태면 updateDrift에서 timer가 줄어들다 확정되고,
  // drift 상태면 timer가 아예 줄어들지 않아 표류 종료 시까지 그대로 반격 축적량으로 남는다.
  player.pendingDamage.push({ amount, timer: CONFIG.DRIFT_DAMAGE_GRACE_PERIOD });
}

function getChaserAttackHitbox(enemy) {
  const w = enemy.attackRangeW, h = enemy.attackRangeH;
  const x = enemy.facing === 1 ? enemy.x + enemy.w : enemy.x - w;
  const y = enemy.y + enemy.h / 2 - h / 2;
  return { x, y, w, h };
}

function updateTurretAI(enemy, dt) {
  const ex = enemy.x + enemy.w / 2, ey = enemy.y + enemy.h / 2;
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  const dx = px - ex, dy = py - ey;
  const distX = Math.abs(dx), distY = Math.abs(dy);

  // 감지 → 어그로 토글 (체이서와 같은 히스테리시스 구조 - 위 "적 공통" CONFIG 섹션 참고). 포탑/저격수는
  // 세 범위가 전부 같은 기본값이라 사실상 즉시 토글되지만, 다른 몬스터와 같은 필드/로직을 공유해서
  // 나중에 값만 달리 줘도 그대로 동작하게 함.
  if (!enemy.aggro) {
    if (distX <= enemy.detectionRangeW && distY <= enemy.detectionRangeH) enemy.aggro = true;
  } else if (distX > enemy.leashRangeW || distY > enemy.leashRangeH) {
    enemy.aggro = false;
    enemy.telegraphing = false;
    enemy.fireTimer = CONFIG.TURRET_FIRE_INTERVAL; // 어그로 다시 끌리면 처음부터 예고하도록 리셋
  }

  // 어그로 안 끌렸으면 완전 대기(예고/발사 타이머도 안 돎) - 화면엔 보여도 아무 행동도 안 하는
  // "유휴" 상태. 나중에 이 분기에 유휴 애니메이션을 추가할 예정 (CLAUDE.md 참고).
  if (!enemy.aggro) return;
  // 공격 범위 밖이면(포탑류는 어그로 범위와 동일값이라 사실상 항상 통과) 발사 안 함.
  if (distX > enemy.attackRangeW || distY > enemy.attackRangeH) return;

  enemy.fireTimer -= dt;

  // 발사 CONFIG.TURRET_TELEGRAPH_DURATION 초 전부터 "공격 예고" 상태로 전환 (시각적 경고)
  enemy.telegraphing = enemy.fireTimer <= CONFIG.TURRET_TELEGRAPH_DURATION;

  if (enemy.fireTimer <= 0) {
    enemy.fireTimer = CONFIG.TURRET_FIRE_INTERVAL;
    enemy.telegraphing = false;
    const len = Math.hypot(dx, dy) || 1;
    const isSniper = enemy.type === "sniper";
    projectiles.push({
      x: ex, y: ey,
      vx: (dx / len) * CONFIG.PROJECTILE_SPEED,
      vy: (dy / len) * CONFIG.PROJECTILE_SPEED,
      r: isSniper ? CONFIG.SNIPER_PROJECTILE_RADIUS : CONFIG.PROJECTILE_RADIUS,
      damage: CONFIG.PROJECTILE_DAMAGE, // 투사체별로 들고 있어서, 나중에 다른 데미지의 투사체가 생겨도 그대로 대응 가능
      // 표류 유예(damagePlayer의 pendingDamage)도 안 타고 반격으로 격추도 안 됨 - updateProjectiles/
      // performDriftCounterAttack 참고. 반드시 몸으로 피해야 하는 투사체라는 뜻.
      unblockable: isSniper,
    });
  }
}

function updateChaserAI(enemy, dt) {
  if (enemy.stunTimer > 0) enemy.stunTimer -= dt;

  // "낮은 fps로 세상을 보는" 연출 - CHASER_PERCEPTION_INTERVAL마다 한 번씩만 실제 플레이어 위치로
  // 다시 채워넣고, 그 사이 프레임들에서는 이 값을 그대로 재사용한다 (아래 모든 인식/추적 판단이 이 값 기준).
  enemy.perceptionTimer -= dt;
  if (enemy.perceptionTimer <= 0) {
    enemy.perceptionTimer = CONFIG.CHASER_PERCEPTION_INTERVAL;
    enemy.perceivedPlayerX = player.x;
    enemy.perceivedPlayerY = player.y;
  }

  const enemyCenterX = enemy.x + enemy.w / 2, enemyCenterY = enemy.y + enemy.h / 2;
  const perceivedCenterX = enemy.perceivedPlayerX + player.w / 2, perceivedCenterY = enemy.perceivedPlayerY + player.h / 2;
  const dist = Math.abs(perceivedCenterX - enemyCenterX);
  const verticalDist = Math.abs(perceivedCenterY - enemyCenterY);
  // 인식 범위: 가로/세로 둘 다 안에 들어와야 "발견"한 것으로 침 (patrol/return 양쪽에서 공용으로 씀)
  const withinDetectionRange = dist <= enemy.detectionRangeW && verticalDist <= enemy.detectionRangeH;

  if (enemy.aiState === "patrol") {
    enemy.x += enemy.facing * CONFIG.CHASER_PATROL_SPEED * dt;
    if (enemy.x <= enemy.patrolMinX) { enemy.x = enemy.patrolMinX; enemy.facing = 1; }
    else if (enemy.x >= enemy.patrolMaxX) { enemy.x = enemy.patrolMaxX; enemy.facing = -1; }

    if (withinDetectionRange) enemy.aiState = "chase";
    return;
  }

  if (enemy.aiState === "chase") {
    // 어그로 범위(가죽끈) 밖으로 멀어졌거나, 플레이어가 낙사 구간 너머로 건너가버렸으면(체이서는
    // 구멍을 못 건너므로) 추적을 포기하고 순찰 위치로 돌아간다.
    if (dist > enemy.leashRangeW || hasGapBetween(enemyCenterX, perceivedCenterX)) {
      enemy.aiState = "return";
      return;
    }

    const dir = perceivedCenterX < enemyCenterX ? -1 : 1;
    enemy.facing = dir;

    if (enemy.stunTimer > 0) {
      // 스턴 중에는 그 자리에 멈춰 서 있음 (사거리 안이어도 예고 진입 불가 - 계속 때리면 영원히 공격을 못 함)
    } else if (rectsOverlap(getChaserAttackHitbox(enemy), player)) {
      // 공격 판정은 거리 계산이 아니라 실제 히트박스 겹침으로 결정한다 - 그래야 발판 위처럼 거리는
      // 가까워도 실제로는 안 닿는 상황에서 헛스윙(예고)이 시작되지 않는다. player는 인식 지연과
      // 무관하게 항상 "지금 실제" 위치를 쓴다 (반응이 느린 것과 판정이 불공정한 건 별개 문제라서).
      enemy.aiState = "windup";
      enemy.attackTimer = CONFIG.CHASER_ATTACK_TELEGRAPH_DURATION;
    } else {
      enemy.x += dir * CONFIG.CHASER_CHASE_SPEED * dt;
    }
    return;
  }

  if (enemy.aiState === "windup") {
    // facing은 windup 진입 시점에 고정된 그대로 유지 - 예고 중에 플레이어가 반대쪽으로 이동해도
    // 이미 보여준 공격 범위가 갑자기 반대로 휙 바뀌면 안 되기 때문 (플레이어 입장에서 납득 가능한 판정)
    enemy.attackTimer -= dt;
    if (enemy.attackTimer <= 0) {
      const hitbox = getChaserAttackHitbox(enemy);
      if (rectsOverlap(hitbox, player)) {
        damagePlayer(CONFIG.CHASER_ATTACK_DAMAGE);
      }
      enemy.aiState = "recovery";
      enemy.attackTimer = CONFIG.CHASER_ATTACK_RECOVERY_DURATION;
    }
    return;
  }

  if (enemy.aiState === "recovery") {
    enemy.attackTimer -= dt;
    if (enemy.attackTimer <= 0) {
      enemy.aiState = dist <= enemy.leashRangeW ? "chase" : "return";
    }
    return;
  }

  if (enemy.aiState === "return") {
    // 복귀 도중에 인식 범위 안에 플레이어가 다시 들어오면 즉시 재추적한다 (어그로 범위가 아니라
    // 인식 범위 기준 - 어그로 범위로 하면 훨씬 넓어서 복귀 중에 거의 항상 재감지되어 버림).
    if (withinDetectionRange) {
      enemy.aiState = "chase";
      return;
    }

    // 순간이동하지 않고, 순찰 속도 그대로 걸어서 순찰 범위로 복귀한다.
    // 이미 순찰 범위 안이면(예: 어그로 범위 안에서 풀린 경우) 바로 순찰로 전환됨.
    if (enemy.x < enemy.patrolMinX) {
      enemy.facing = 1;
      enemy.x = Math.min(enemy.patrolMinX, enemy.x + CONFIG.CHASER_PATROL_SPEED * dt);
    } else if (enemy.x > enemy.patrolMaxX) {
      enemy.facing = -1;
      enemy.x = Math.max(enemy.patrolMaxX, enemy.x - CONFIG.CHASER_PATROL_SPEED * dt);
    }
    if (enemy.x >= enemy.patrolMinX && enemy.x <= enemy.patrolMaxX) {
      enemy.aiState = "patrol";
    }
  }
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    if (enemy.flashTimer > 0) enemy.flashTimer -= dt;
    if (!enemy.alive) continue;
    if (gameState !== "playing") continue;

    // 화면에 한 번이라도 들어온 적이 있는지 기록 (한 번 보이고 나면 이후 화면 밖으로 나가도 계속 유지).
    // 단, 봉쇄 벽 너머의 몬스터는 벽이 잠긴 동안은 화면에 보여도 "안 보인 것"으로 취급.
    if (!enemy.hasBeenVisible && isInCameraView(enemy) && !isBehindLockedWall(enemy)) {
      enemy.hasBeenVisible = true;
    }

    // 아직 한 번도 화면에 보인 적 없는 몬스터는 완전 대기 상태 - 순찰/추적/발사 전부 안 함.
    // (화면에 등장하는 순간부터 정상적으로 움직이기 시작해서, 예고 없이 갑자기 당하는 일이 없음)
    if (!enemy.hasBeenVisible) continue;

    if (enemy.type === "chaser") updateChaserAI(enemy, dt);
    else updateTurretAI(enemy, dt);
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.x < -50 || p.x > WORLD_WIDTH + 50 || p.y < -50 || p.y > H + 50) {
      projectiles.splice(i, 1);
      continue;
    }

    if (gameState === "playing" &&
        circleRectOverlap(p.x, p.y, p.r, player) &&
        player.invincibleTimer <= 0) {
      // unblockable: 피격 유예(pendingDamage)를 거치지 않고 즉시 HP에 반영 - anchor의 유예도,
      // drift 중 축적도 못 타므로 표류/반격으로는 절대 무효화할 수 없고 몸으로 피해야만 한다.
      // (무적 프레임은 다른 피격과 동일하게 적용됨 - applyDamageToHp가 부여)
      if (p.unblockable) applyDamageToHp(p.damage);
      else damagePlayer(p.damage);
      projectiles.splice(i, 1);
    }
  }
}

function update(dt) {
  if (gameState === "respawning") {
    respawnTimer -= dt;
    updateProjectiles(dt); // 날아가던 투사체는 계속 정리되게
    if (respawnTimer <= 0) respawnPlayer();
  } else {
    updatePlayer(dt);
    updateGhostNpc(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
  }

  updateCamera(dt);

  // justPressed 소비 완료 -> 프레임 끝에서 초기화
  for (const k in justPressed) delete justPressed[k];
}

/* --------------------------- 렌더링 --------------------------- */

function drawRect(r, color) {
  ctx.fillStyle = color;
  ctx.fillRect(r.x, r.y, r.w, r.h);
}

// 몬스터 체력 pip 1칸 - 마름모(다이아) 모양. fillRatio(0~1)만큼 왼쪽부터 채워서 반칸 체력(0.5)을
// 표현한다. 몬스터 HP를 부풀리지 않고도(ATTACK_DAMAGE=1, 공중 공격=0.5) 체력을 정확히 보여주기 위한
// 용도 - enemy.hp가 정수+0.5 단위로만 줄어드므로 fillRatio는 항상 0/0.5/1 중 하나만 나온다.
function drawHpPip(cx, cy, size, fillRatio) {
  const half = size / 2;
  function diamondPath() {
    ctx.beginPath();
    ctx.moveTo(cx, cy - half);
    ctx.lineTo(cx + half, cy);
    ctx.lineTo(cx, cy + half);
    ctx.lineTo(cx - half, cy);
    ctx.closePath();
  }
  diamondPath();
  ctx.fillStyle = "rgba(0,0,0,0.4)"; // 빈 칸 배경
  ctx.fill();
  if (fillRatio > 0) {
    ctx.save();
    diamondPath();
    ctx.clip();
    ctx.fillStyle = "#ffd54f";
    ctx.fillRect(cx - half, cy - half, size * fillRatio, size); // 왼쪽부터 fillRatio만큼만 채움(클립으로 다이아 모양 유지)
    ctx.restore();
  }
  diamondPath();
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

// 유령 NPC 렌더링 - 함수로 분리한 이유는 draw()에서 플레이어와 겹칠 때만 호출 순서를
// 바꿔서(플레이어보다 나중에 그려서 위에 보이게) 써야 하기 때문.
function drawGhostNpc() {
  const ghostW = player.w * 0.5, ghostH = player.h * 0.5;
  const ghostDrawX = ghostNpc.x + (player.w - ghostW) / 2; // 가로 중심 정렬
  const ghostDrawY = ghostNpc.y + (player.h - ghostH);     // 바닥(발) 위치 정렬
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = "#b39ddb";
  ctx.fillRect(ghostDrawX, ghostDrawY, ghostW, ghostH);
  // 눈 - 지금 실제로 이동 중인 방향을 가리킴 (플레이어 눈과 같은 스타일, 크기만 절반)
  ctx.fillStyle = "#4a148c";
  const eyeSize = 3;
  const eyeX = ghostNpc.facing === 1 ? ghostDrawX + ghostW - eyeSize - 1 : ghostDrawX + 1;
  ctx.fillRect(eyeX, ghostDrawY + 4, eyeSize, eyeSize);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 배경 (화면 좌표 기준 - 카메라와 무관하게 항상 뷰포트 전체를 채움)
  ctx.fillStyle = "#2b2f3a";
  ctx.fillRect(0, 0, W, H);

  // ===== 여기서부터 월드 좌표계 =====
  // ctx.translate로 카메라만큼 밀어서, 아래 코드는 전부 "월드 좌표 그대로" 그리면 됨.
  // 플레이어/적/투사체/지형처럼 카메라를 따라 스크롤되어야 하는 것만 이 블록 안에 넣을 것.
  // (반대로 HP바/조작안내/쿨다운 게이지/리스폰 문구는 canvas가 아니라 HTML 오버레이라서
  //  애초에 카메라 영향을 받지 않음 - updateHud() 쪽 참고)
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // 지형 - 고정형(완전 차단)은 회색, 원웨이(관통형)는 청록색 + 상단에 밝은 선으로 구분
  for (const s of solidPlatforms) drawRect(s, "#555b6e");
  for (const p of oneWayPlatforms) {
    drawRect(p, "#3f7068");
    ctx.fillStyle = "#8de6cf";
    ctx.fillRect(p.x, p.y, p.w, 3); // 위쪽 밝은 라인 = "위에서만 착지 가능" 표시
  }

  // 봉쇄 벽 (안쪽 몬스터를 다 잡아야 사라짐) - 잠겨있을 때만 그림
  if (isWallLocked()) {
    drawRect(WALL_VISUAL, "#c2410c");
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let sy = WALL_VISUAL.y - WALL_VISUAL.w; sy < WALL_VISUAL.y + WALL_VISUAL.h; sy += 22) {
      ctx.moveTo(WALL_VISUAL.x, sy);
      ctx.lineTo(WALL_VISUAL.x + WALL_VISUAL.w, sy + WALL_VISUAL.w);
    }
    ctx.stroke();

    const remaining = countAliveArenaEnemies();
    ctx.fillStyle = "#ffe0b2";
    ctx.font = "bold 15px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("봉쇄 구역", WALL_VISUAL.x + WALL_VISUAL.w / 2, WALL_VISUAL.y - 14);
    ctx.fillText(`남은 몬스터: ${remaining}`, WALL_VISUAL.x + WALL_VISUAL.w / 2, WALL_VISUAL.y + WALL_VISUAL.h + 20);
    ctx.textAlign = "left"; // 이후 다른 텍스트 렌더링에 영향 없도록 기본값으로 복귀
  }

  // 적 (포탑 + 체이서 공통 렌더링. 보라색 = 근접 공격으로도 스턴 안 걸리는 면역 개체 - 타입 공통 표시)
  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    const isChaser = enemy.type === "chaser";
    const isSniper = enemy.type === "sniper";
    const isWarning = isChaser ? enemy.aiState === "windup" : enemy.telegraphing;
    const baseColor = !enemy.stunnable
      ? "#8e44ad"
      : isChaser ? "#5c8a3a"
      : isSniper ? "#00838f" // 포탑(빨강)/체이서(초록)/면역(보라)과 겹치지 않는 청록 - "다른 놈"이라는 신호
      : "#b23b3b";
    let color = enemy.flashTimer > 0 ? "#ffffff" : baseColor;
    // 공격 예고 중에는 빠르게 밝아졌다 어두워지는 색으로 경고 (체이서는 근접 느낌의 붉은 계열,
    // 저격수는 투사체와 짝을 맞춘 마젠타 계열로 구분 - 반드시 피해야 하는 예고라는 걸 색으로도 강조)
    if (isWarning) {
      const pulse = (Math.sin(performance.now() / 60) + 1) / 2; // 0~1
      color = isChaser ? (pulse > 0.5 ? "#ff5252" : "#ff8a65")
        : isSniper ? (pulse > 0.5 ? "#f50057" : "#ff4081")
        : (pulse > 0.5 ? "#ffb300" : "#ff6f3c");
    }
    drawRect(enemy, color);
    // "눈" - 플레이어 방향을 향하는 작은 원, 예고 중엔 커지고 밝아짐
    ctx.fillStyle = isWarning ? "#fff59d" : "#241010";
    ctx.beginPath();
    const cx = enemy.x + enemy.w / 2, cy = enemy.y + enemy.h / 2;
    ctx.arc(cx, cy, isWarning ? 9 : 6, 0, Math.PI * 2);
    ctx.fill();
    // 체력 pip (마름모, 반칸 표현 가능 - drawHpPip 참고). 슬롯 개수는 maxHp 기준으로 고정,
    // 각 슬롯이 얼마나 채워졌는지는 남은 hp를 슬롯별로 0~1로 잘라서 계산.
    const pipSize = 11, gap = 4;
    const pipCount = enemy.maxHp;
    const totalW = pipCount * pipSize + (pipCount - 1) * gap;
    let pipCx = enemy.x + enemy.w / 2 - totalW / 2 + pipSize / 2;
    const pipCy = enemy.y - 12;
    for (let i = 0; i < pipCount; i++) {
      const fillRatio = clamp(enemy.hp - i, 0, 1);
      drawHpPip(pipCx, pipCy, pipSize, fillRatio);
      pipCx += pipSize + gap;
    }

    // 체이서 전용: 공격 예고(선딜레이) 중에는 실제로 맞을 범위를 미리 그려서 보여줌
    if (isChaser && enemy.aiState === "windup") {
      const hb = getChaserAttackHitbox(enemy);
      ctx.fillStyle = "rgba(255,82,82,0.35)";
      ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
      ctx.strokeStyle = "rgba(255,82,82,0.9)";
      ctx.lineWidth = 2;
      ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
    }
  }

  // 투사체 - unblockable(저격수 투사체)은 표류/반격으로 못 없애는 만큼 색/크기/광륜으로 확실히
  // 다르게 그려서 "이건 반드시 피해야 한다"가 멀리서도 즉시 보이게 한다.
  for (const p of projectiles) {
    if (p.unblockable) {
      ctx.save();
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#ff1744";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#fff59d";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#ffee58";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 공격 판정 시각화
  if (player.attackState === "active") {
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    if (player.attackIsAirborne) {
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + player.h / 2, CONFIG.AIR_ATTACK_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const hb = getAttackHitbox();
      ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
    }
  }

  // 유령 NPC는 평소엔 플레이어와 거리를 두고 있어서 먼저(아래에) 그려도 상관없지만, 방향이 바뀌어
  // 반대편으로 이동하는 도중에는 잠깐 플레이어와 실제로 겹칠 수 있다 - 그 순간만큼은 플레이어에게
  // 가려지지 않도록 나중에(위에) 그린다.
  const ghostBox = { x: ghostNpc.x, y: ghostNpc.y, w: player.w, h: player.h };
  const ghostOverlapsPlayer = gameState === "playing" && rectsOverlap(ghostBox, player);
  if (gameState === "playing" && !ghostOverlapsPlayer) drawGhostNpc();

  // 플레이어
  if (gameState === "playing") {
    // 표류 잔상 - 별도 오브젝트/히트박스 아님, 본체 위치 기록을 흐리게 겹쳐 그리는 순수 시각효과
    if (player.state === "drift") {
      for (let i = 0; i < player.driftTrail.length - 1; i++) {
        const t = player.driftTrail[i];
        ctx.globalAlpha = 0.08 + 0.05 * i;
        ctx.fillStyle = "#4fc3f7";
        ctx.fillRect(t.x, t.y, player.w, player.h);
      }
      ctx.globalAlpha = 1;
    }

    let color = "#4fc3f7";
    if (player.invincibleTimer > 0 && Math.floor(performance.now() / 60) % 2 === 0) color = "#ffffff";

    ctx.globalAlpha = player.state === "drift" ? 0.55 : 1; // 표류 중엔 본체도 살짝 반투명
    drawRect(player, color);

    // 바라보는 방향 표시 (작은 삼각형 느낌의 사각형)
    ctx.fillStyle = "#01579b";
    const eyeX = player.facing === 1 ? player.x + player.w - 8 : player.x + 2;
    ctx.fillRect(eyeX, player.y + 8, 6, 6);
    ctx.globalAlpha = 1;

    // 축적된 반격 데미지 표시 - 표류 종료 시 이만큼의 데미지가 광역 반격으로 나간다는 걸 눈으로 알 수 있게
    if (player.pendingDamage.length > 0) {
      const totalPending = player.pendingDamage.reduce((sum, e) => sum + e.amount, 0);
      const pulse = (Math.sin(performance.now() / 80) + 1) / 2;
      ctx.fillStyle = pulse > 0.5 ? "#ffd54f" : "#ffecb3";
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y - 14, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#3e2723";
      ctx.font = "bold 11px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(totalPending), player.x + player.w / 2, player.y - 10);
      ctx.textAlign = "left";
    }
  }
  if (ghostOverlapsPlayer) drawGhostNpc(); // 겹치는 프레임엔 플레이어를 그린 다음에 그려서 위에 보이게 함

  // 표류 반격 판정을 잠깐 보여주는 시각효과 (월드 좌표계 - 카메라와 함께 스크롤).
  // 터질 때 확 밝았다가 그라데이션으로 점점 옅어짐 - 실시간으로 페이드되므로(tickDriftBurst)
  // DRIFT_BURST_VISUAL_DURATION이 HITSTOP_DOUBLE_HIT_GAP보다 짧게 잡혀있어서, 2연타의 경우
  // 1타(하늘색)가 완전히 사라진 뒤 잠깐의 암전을 거쳐 2타(금색)가 다시 확 밝아지는 게 눈에 보인다.
  if (player.driftBurst) {
    const b = player.driftBurst;
    const alpha = clamp(b.timer / CONFIG.DRIFT_BURST_VISUAL_DURATION, 0, 1);
    const strokeRGB = b.variant === "bonus" ? "255,193,7" : "79,195,247"; // 2타=금색, 1타=하늘색
    ctx.fillStyle = `rgba(255,255,255,${0.65 * alpha})`;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = `rgba(${strokeRGB},${alpha})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  ctx.restore();
  // ===== 여기부터 다시 화면(screen) 좌표계 =====

  // 유예시간 경고 - anchor 상태에서 맞아서 아직 확정 안 된 피해가 있으면 화면이 붉게 깜빡임.
  // 이 깜빡임이 보이는 동안 표류(우클릭)를 쓰면 지금 깜빡이는 피해가 취소되고 반격으로 축적된다.
  if (gameState === "playing" && player.state === "anchor" && player.pendingDamage.length > 0) {
    const pulse = (Math.sin(performance.now() / 60) + 1) / 2;
    const alpha = 0.15 + 0.25 * pulse;
    ctx.fillStyle = `rgba(255,82,82,${alpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 표류 중 화면 틴트 - 연파랑으로 "지금 표류 상태"임을 알려주되, 축적된 피해가 있으면(=지금 끝나도
  // 자해 대신 반격이 나감, 안전한 상태) 더 진한 파랑으로 구분해서 보여줌.
  if (gameState === "playing" && player.state === "drift") {
    const hasAccumulatedDamage = player.pendingDamage.length > 0;
    ctx.fillStyle = hasAccumulatedDamage ? "rgba(41,121,255,0.38)" : "rgba(79,195,247,0.22)";
    ctx.fillRect(0, 0, W, H);
  }

  // 타임스톱 원인별 화면 틴트 - 위의 옅은 틴트들 위에 덧씌워서 그 순간만 확 진해지는 느낌을 줌.
  // 피격 확정(damage)은 더 강한 빨강, 반격 발동(counter)은 더 강한 파랑. 타임스톱 잔여시간 비율로 페이드.
  if (timeStopTimer > 0 && timeStopReason) {
    const fade = clamp(timeStopTimer / timeStopDuration, 0, 1);
    if (timeStopReason === "damage") {
      ctx.fillStyle = `rgba(255,23,23,${0.55 * fade})`;
    } else {
      ctx.fillStyle = `rgba(41,121,255,${0.5 * fade})`;
    }
    ctx.fillRect(0, 0, W, H);
  }

  // HUD (HTML 오버레이) 갱신 - 이 요소들은 애초에 canvas 밖의 절대 위치 DOM이라 카메라와 무관함
  updateHud();
}

/* --------------------------- HUD --------------------------- */
const hpBarInner = document.getElementById("hpBarInner");
const hpText = document.getElementById("hpText");
const atkCdBar = document.getElementById("atkCdBar");
const driftCdBar = document.getElementById("driftCdBar");
const respawnMsg = document.getElementById("respawnMsg");

function updateHud() {
  const hpRatio = clamp(player.hp / CONFIG.PLAYER_MAX_HP, 0, 1);
  hpBarInner.style.width = (hpRatio * 100) + "%";
  hpText.textContent = `HP ${Math.max(0, player.hp)} / ${CONFIG.PLAYER_MAX_HP}`;

  // 판정 활성(active) 중엔 항상 0% - 재사용 불가 구간이라 진행률을 보여줄 필요가 없음.
  // recovery 진입부터 ATTACK_RECOVERY_DURATION을 기준으로 게이지가 차오름.
  let atkRatio;
  if (player.attackState === "active") {
    atkRatio = 0;
  } else if (player.attackState === "recovery") {
    atkRatio = 1 - clamp(player.attackTimer / CONFIG.ATTACK_RECOVERY_DURATION, 0, 1);
  } else {
    atkRatio = 1;
  }
  atkCdBar.style.width = (atkRatio * 100) + "%";
  atkCdBar.style.background = atkRatio >= 1 ? "#ffb74d" : "#555";

  // 표류 쿨타임 진행 상태만 표시: 표류 중엔 꽉 찬 채로 "사용 중" 색, 아니면 쿨타임이 채워지는 방향으로 표시
  // (꽉 차있으면 다시 표류 가능, 비어있을수록 쿨타임이 많이 남은 것) - 게이지/홀드 로직은 완전히 제거됨
  if (player.state === "drift") {
    driftCdBar.style.width = "100%";
    driftCdBar.style.background = "#ba68c8";
  } else {
    const driftReadyRatio = 1 - clamp(player.driftCooldownTimer / player.driftCooldownDuration, 0, 1);
    driftCdBar.style.width = (driftReadyRatio * 100) + "%";
    driftCdBar.style.background = driftReadyRatio >= 1 ? "#7e57c2" : "#555";
  }

  respawnMsg.style.display = gameState === "respawning" ? "block" : "none";
}

/* --------------------------- 메인 루프 --------------------------- */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.033); // 탭 전환 등으로 인한 프레임 급증 방지

  if (timeStopTimer > 0) {
    // update() 자체를 건너뛴다 - 플레이어/적/투사체/무적시간 등 모든 타이머가 이 프레임엔 그대로 정지.
    // 화면은 계속 그려서(draw) "멈춘 순간"이 화면에 정지 프레임으로 보이게 한다.
    timeStopTimer = Math.max(0, timeStopTimer - dt);
    if (timeStopTimer <= 0) {
      timeStopReason = null;
      // 타임스톱 도중 눌렸던 키가 지금도 눌려있으면 지금 막 누른 것으로 쳐서 이번 프레임에 바로 반영.
      // 이미 떼버린 키는 pendingKeyAfterFreeze에 남아있어도 heldKeys가 false라 무시됨.
      for (const code in pendingKeyAfterFreeze) {
        if (heldKeys[code]) justPressed[code] = true;
        delete pendingKeyAfterFreeze[code];
      }
      // 이 프리즈 구간에 이어붙일 다음 동작(예: 반격 2타)이 있으면 실행 - 그 안에서 triggerTimeStop을
      // 다시 호출하면 화면이 안 풀리고 바로 다음 프리즈 구간으로 넘어간다.
      const onComplete = timeStopOnComplete;
      timeStopOnComplete = null;
      if (onComplete) onComplete();
    }
  } else {
    update(dt);
  }
  tickDriftBurst(dt); // 타임스톱 여부와 무관하게 항상 실시간으로 흐름 (이유는 tickDriftBurst 주석 참고)
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
