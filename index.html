<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2D 액션 플랫포머 프로토타입</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14151a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Consolas, monospace;
    color: #eee;
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas {
    background: #2b2f3a;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair; /* 공격/표류 방향이 마우스 조준이므로 조준경 커서로 표시 */
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }
  #hpBarOuter {
    position: relative;
    width: 200px;
    height: 22px;
    border: 2px solid #eee;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
  }
  #hpBarInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(#ff5c5c, #c62828);
    transition: width 0.12s linear;
  }
  #hpText {
    font-size: 13px;
    margin-top: 3px;
    text-shadow: 1px 1px 2px #000;
  }
  #cooldownRow {
    margin-top: 6px;
    display: flex;
    gap: 8px;
    font-size: 11px;
  }
  .cdBox {
    width: 70px;
  }
  .cdLabel {
    text-shadow: 1px 1px 2px #000;
    margin-bottom: 2px;
  }
  .cdBarOuter {
    position: relative;
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.4);
    border: 1px solid #888;
    border-radius: 3px;
    overflow: hidden;
  }
  .cdBarInner {
    height: 100%;
    width: 0%;
    background: #4fc3f7;
  }
  #respawnMsg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: bold;
    color: #ff5c5c;
    text-shadow: 2px 2px 6px #000;
    display: none;
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }
  /* 컷신 텍스트박스 - 화면 하단, 인물 이름(있으면) + 대사. 클릭/키 입력으로 다음 줄 진행(cutscene.js). */
  #cutsceneBox {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 24px;
    background: rgba(0,0,0,0.72);
    border: 2px solid #eee;
    border-radius: 6px;
    padding: 14px 18px;
    display: none;
    pointer-events: none;
    user-select: none;
    z-index: 4;
  }
  #cutsceneSpeaker {
    font-weight: bold;
    color: #ffd54f;
    margin-bottom: 4px;
    font-size: 14px;
  }
  #cutsceneLine {
    font-size: 16px;
    line-height: 1.4;
  }
  /* 페이드 오버레이 - 그 무엇(HUD 포함)보다도 위에 있어야 "완전한 암전"이 성립한다 (cutscene.js). */
  #fadeOverlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  /* 메인 메뉴(js/engine/mainmenu.js) - 게임의 실제 시작 화면. fadeOverlay(5)보다는 위, QA
     패널(10)보다는 아래 - "구역 선택" 버튼을 누르면 이 화면 위에 QA 패널이 그대로 겹쳐 뜨고, 패널을
     선택 없이 닫으면(Esc) 다시 이 메뉴로 자연스럽게 돌아온다(별도의 "뒤로가기" 로직 없이 그냥
     숨겨지지 않고 계속 떠 있었을 뿐이라 가능한 동작 - mainmenu.js 참고). */
  #mainMenu {
    position: absolute;
    inset: 0;
    background: #14151a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 9;
  }
  #mainMenuTitle {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 18px;
    text-shadow: 1px 1px 3px #000;
  }
  .mainMenuBtn {
    width: 220px;
    padding: 14px 0;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
    border-radius: 6px;
    border: 2px solid #555b6e;
    cursor: pointer;
  }
  #mainMenuStartBtn {
    background: #ffd54f;
    color: #14151a;
    border-color: #ffd54f;
  }
  #mainMenuStartBtn:hover {
    background: #ffe082;
  }
  #mainMenuZoneSelectBtn {
    background: #33384a;
    color: #eee;
  }
  #mainMenuZoneSelectBtn:hover {
    background: #46506b;
  }
  /* 일시정지 메뉴(js/engine/pausemenu.js) - 실제 플레이 중 백틱을 누르면 뜬다(메인 메뉴 단계에서는
     대신 QA 패널이 바로 뜸 - pausemenu.js의 라우팅 참고). 메인 메뉴와 똑같이 mainMenuBtn 스타일을
     그대로 재사용하고, 절대 mainMenu와 동시에 보이지 않으므로(둘 다 "지금 보여줄 화면 하나") 같은
     z-index를 써도 안전함. */
  #pauseMenu {
    position: absolute;
    inset: 0;
    background: #14151a;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 9;
  }
  #pauseMenuTitle {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 18px;
    text-shadow: 1px 1px 3px #000;
  }
  #pauseResumeBtn {
    background: #ffd54f;
    color: #14151a;
    border-color: #ffd54f;
  }
  #pauseResumeBtn:hover {
    background: #ffe082;
  }
  #pauseMainMenuBtn,
  #pauseZoneSelectBtn {
    background: #33384a;
    color: #eee;
  }
  #pauseMainMenuBtn:hover,
  #pauseZoneSelectBtn:hover {
    background: #46506b;
  }
  /* QA 패널(구역 이동, js/engine/qapanel.js) - 페이드보다도 위(z-index 10)에 둬서 히트스톱/컷신/암전
     도중에도 항상 열고 조작할 수 있게 한다("막혔을 때 빠져나오는 비상구" 용도도 겸함). 다른 오버레이와
     달리 pointer-events: auto가 필요 - 버튼을 실제로 클릭해야 하기 때문(캔버스 위를 완전히 덮으므로
     이 패널이 열려있는 동안은 클릭이 캔버스의 공격 입력으로 새지 않는다). */
  #qaPanel {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 14, 0.82);
    display: none;
    z-index: 10;
    padding: 36px 24px;
    box-sizing: border-box;
    overflow-y: auto;
    pointer-events: auto;
  }
  #qaPanelCard {
    max-width: 380px;
    margin: 0 auto;
    background: rgba(20, 21, 26, 0.96);
    border: 2px solid #555b6e;
    border-radius: 8px;
    padding: 16px 18px 18px;
  }
  #qaPanelTitle {
    font-size: 18px;
    font-weight: bold;
  }
  #qaPanelHint {
    font-size: 12px;
    color: #999;
    margin: 4px 0 14px;
  }
  /* 메인 메뉴/일시정지 메뉴용 - #qaPanelHint와 같은 스타일이지만 ID 하나에 묶여있지 않은 재사용 클래스 */
  .menuHint {
    font-size: 12px;
    color: #999;
    margin-top: -4px;
  }
  .qaPanelFloorHeading {
    font-size: 13px;
    font-weight: bold;
    color: #ffd54f;
    margin: 14px 0 6px;
  }
  .qaPanelFloorHeading:first-child {
    margin-top: 0;
  }
  .qaPanelZoneBtn {
    display: block;
    width: 100%;
    text-align: left;
    background: #33384a;
    color: #eee;
    border: 1px solid #555b6e;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .qaPanelZoneBtn:hover {
    background: #46506b;
  }
  .qaPanelZoneBtnCurrent {
    border-color: #ffd54f;
    color: #ffd54f;
  }
  /* 키보드 탐색(W/S) 포커스 표시 - "현재 위치"(금색 테두리)와 겹쳐도 구분되도록 별도 색(하늘색,
     플레이어/DRIFT 게이지와 같은 계열)의 두꺼운 outline을 씀(border가 아니라 outline이라 레이아웃이
     안 밀림 - qaPanelZoneBtnCurrent의 border-color와 동시에 적용돼도 서로 안 밀어냄). */
  .qaPanelZoneBtnFocused {
    outline: 2px solid #4fc3f7;
    outline-offset: -1px;
  }
  /* 메인 메뉴/일시정지 메뉴의 W/S 키보드 탐색 강조 표시 (js/engine/menunav.js) - QA 패널의
     .qaPanelZoneBtnFocused와 같은 스타일을 그대로 재사용. */
  .menuBtnFocused {
    outline: 2px solid #4fc3f7;
    outline-offset: -1px;
  }
  /* 확인 대화상자(js/engine/confirmdialog.js) - 구역 워프/메인 화면 이동처럼 되돌리기 번거로운
     동작 전에 "예/아니오"를 한 번 더 묻는다. QA 패널(z-index 10) 위에도, 일시정지 메뉴 위에도 뜰 수
     있어야 해서 그보다 높은 z-index를 씀. 다른 오버레이와 동일하게 기본값은 반드시 none으로 시작 -
     안 그러면 페이지를 열자마자 이 화면이 다른 걸 가려버리는 버그가 재발함(#pauseMenu에서 실제로
     겪은 사례, CLAUDE.md 참고). */
  #confirmDialog {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 14, 0.82);
    display: none;
    z-index: 11;
    align-items: center;
    justify-content: center;
  }
  #confirmDialogCard {
    background: rgba(20, 21, 26, 0.96);
    border: 2px solid #555b6e;
    border-radius: 8px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 360px;
  }
  #confirmDialogMessage {
    font-size: 15px;
    text-align: center;
    line-height: 1.4;
  }
  #confirmDialogBtnRow {
    display: flex;
    gap: 10px;
  }
  #confirmDialogBtnRow .mainMenuBtn {
    width: 100px;
    padding: 10px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="1440" height="810"></canvas>
  <div id="hud">
    <div id="hpBarOuter">
      <div id="hpBarInner"></div>
    </div>
    <div id="hpText">HP 5 / 5</div>
    <div id="cooldownRow">
      <div class="cdBox">
        <div class="cdLabel">ATTACK</div>
        <div class="cdBarOuter"><div id="atkCdBar" class="cdBarInner"></div></div>
      </div>
      <div class="cdBox">
        <div class="cdLabel">DRIFT</div>
        <div class="cdBarOuter"><div id="driftCdBar" class="cdBarInner"></div></div>
      </div>
    </div>
  </div>
  <div id="respawnMsg">Respawn...</div>
  <div id="cutsceneBox">
    <div id="cutsceneSpeaker"></div>
    <div id="cutsceneLine"></div>
  </div>
  <div id="fadeOverlay"></div>
  <div id="qaPanel">
    <div id="qaPanelCard">
      <div id="qaPanelTitle">구역 이동</div>
      <div id="qaPanelHint">클릭 또는 W/S로 고르고 Space/Enter로 이동 · ` 또는 Esc로 닫기</div>
      <div id="qaPanelList"></div>
    </div>
  </div>
  <div id="mainMenu">
    <div id="mainMenuTitle">2D 액션 플랫포머 프로토타입</div>
    <button id="mainMenuStartBtn" class="mainMenuBtn" type="button">게임 시작</button>
    <button id="mainMenuZoneSelectBtn" class="mainMenuBtn" type="button">구역 선택</button>
    <div class="menuHint">W/S로 고르고 Space/Enter로 선택</div>
  </div>
  <div id="pauseMenu">
    <div id="pauseMenuTitle">일시정지</div>
    <button id="pauseResumeBtn" class="mainMenuBtn" type="button">재개</button>
    <button id="pauseMainMenuBtn" class="mainMenuBtn" type="button">메인 화면</button>
    <button id="pauseZoneSelectBtn" class="mainMenuBtn" type="button">구역 선택</button>
    <div class="menuHint">W/S로 고르고 Space/Enter로 선택 · ` 또는 Esc로 닫기</div>
  </div>
  <div id="confirmDialog">
    <div id="confirmDialogCard">
      <div id="confirmDialogMessage"></div>
      <div id="confirmDialogBtnRow">
        <button id="confirmDialogYesBtn" class="mainMenuBtn" type="button">예</button>
        <button id="confirmDialogNoBtn" class="mainMenuBtn" type="button">아니오</button>
      </div>
    </div>
  </div>
</div>

<!--
  전부 번들러 없는 클래식 <script> - 전역 스코프를 공유한다. 순서 제약은 두 가지뿐:
  1) js/levels/*.js는 js/engine/zones.js(ZONES 선언) 다음이어야 함 (파싱 시점에 ZONES[...]에 등록하므로)
  2) js/main.js는 반드시 맨 마지막 (currentCheckpoint/loadZone 등 다른 모든 파일이 이미 로드되어 있어야 부트스트랩 가능)
  그 외 순서는 실행 시점(함수 호출 시점)에 해석되므로 상관없다.
-->
<script src="js/config.js"></script>
<script src="js/engine/dom.js"></script>
<script src="js/engine/input.js"></script>
<script src="js/engine/timestop.js"></script>
<script src="js/engine/camera.js"></script>
<script src="js/entities/enemies.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/engine/zones.js"></script>
<script src="js/engine/checkpoint.js"></script>
<script src="js/engine/cutscene.js"></script>
<script src="js/engine/qapanel.js"></script>
<script src="js/engine/menunav.js"></script>
<script src="js/engine/confirmdialog.js"></script>
<script src="js/rendering.js"></script>
<script src="js/levels/f2z3-legacy-arena.js"></script>
<script src="js/levels/f1z1-entry.js"></script>
<script src="js/levels/f1z2-platforms.js"></script>
<script src="js/levels/f1z3-melee-practice.js"></script>
<script src="js/levels/f1z4-background-monsters.js"></script>
<script src="js/levels/f1z5-fatal-encounter.js"></script>
<script src="js/levels/f1z6-drift-practice.js"></script>
<script src="js/engine/mainmenu.js"></script>
<script src="js/engine/pausemenu.js"></script>
<script src="js/main.js"></script>
</body>
</html>
